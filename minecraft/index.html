<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BlockWorld v0.5</title>
  
  <!-- External Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/simplex-noise@2.4.0/simplex-noise.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #000;
      color: #fff;
    }

    #game-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* UI Overlay */
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
    }

    .interactive {
      pointer-events: auto;
    }

    /* Crosshair */
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 12px;
      height: 12px;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.8);
    }
    #crosshair::before { top: 5px; left: 0; width: 12px; height: 2px; }
    #crosshair::after { top: 0; left: 5px; width: 2px; height: 12px; }

    /* Menus & Modals */
    .modal {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(20, 20, 25, 0.9);
      border: 2px solid #444;
      border-radius: 8px;
      padding: 24px;
      width: 320px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
      text-align: center;
    }
    .modal.active { display: block; }
    .modal h2 { margin-bottom: 16px; color: #4CAF50; }
    
    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      background: #333;
      color: white;
      border: 1px solid #555;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    .btn:hover { background: #45a049; }

    .input-group {
      margin: 10px 0;
      text-align: left;
    }
    .input-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 4px; }
    .input-group input, .input-group select {
      width: 100%;
      padding: 8px;
      background: #222;
      border: 1px solid #444;
      color: white;
      border-radius: 4px;
    }

    /* HUD Elements */
    #hud {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    #hotbar {
      display: flex;
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid #555;
      border-radius: 6px;
      padding: 3px;
    }
    .slot {
      width: 44px;
      height: 44px;
      border: 2px solid #333;
      margin: 0 2px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 11px;
      background: rgba(250, 250, 250, 0.1);
      position: relative;
    }
    .slot.selected {
      border-color: #fff;
      background: rgba(255, 255, 255, 0.3);
    }
    .slot-key {
      position: absolute;
      top: 2px;
      left: 3px;
      font-size: 9px;
      color: #aaa;
    }

    /* Mobile Controls */
    #mobile-controls {
      display: none;
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0; left: 0;
      pointer-events: none;
    }
    @media (max-width: 768px), (pointer: coarse) {
      #mobile-controls { display: block; }
    }
    .touch-btn {
      position: absolute;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      color: white;
      font-weight: bold;
    }
    #btn-jump { bottom: 80px; right: 20px; width: 60px; height: 60px; }
    #btn-break { bottom: 20px; right: 90px; width: 50px; height: 50px; background: rgba(255, 50, 50, 0.3); }
    #btn-place { bottom: 80px; right: 90px; width: 50px; height: 50px; background: rgba(50, 255, 50, 0.3); }

    /* Joystick */
    #joystick-zone {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 120px;
      height: 120px;
      background: rgba(255,255,255,0.05);
      border-radius: 50%;
      pointer-events: auto;
    }
    #joystick-knob {
      position: absolute;
      width: 50px;
      height: 50px;
      background: rgba(255,255,255,0.3);
      border-radius: 50%;
      top: 35px;
      left: 35px;
    }
  </style>
</head>
<body>

  <div id="game-container"></div>

  <div id="ui-layer">
    <div id="crosshair"></div>

    <!-- HUD -->
    <div id="hud">
      <div id="hotbar">
        <div class="slot selected" data-block="1"><span class="slot-key">1</span>Grass</div>
        <div class="slot" data-block="2"><span class="slot-key">2</span>Dirt</div>
        <div class="slot" data-block="3"><span class="slot-key">3</span>Stone</div>
        <div class="slot" data-block="4"><span class="slot-key">4</span>Wood</div>
        <div class="slot" data-block="5"><span class="slot-key">5</span>Leaves</div>
        <div class="slot" data-block="6"><span class="slot-key">6</span>Glass</div>
        <div class="slot" data-block="7"><span class="slot-key">7</span>Brick</div>
        <div class="slot" data-block="8"><span class="slot-key">8</span>Planks</div>
      </div>
    </div>

    <!-- Mobile Controls Overlay -->
    <div id="mobile-controls">
      <div id="joystick-zone">
        <div id="joystick-knob"></div>
      </div>
      <div id="btn-jump" class="touch-btn">JUMP</div>
      <div id="btn-break" class="touch-btn">MINE</div>
      <div id="btn-place" class="touch-btn">PLACE</div>
    </div>

    <!-- Main Menu Modal -->
    <div id="menu-modal" class="modal interactive active">
      <h2>BlockWorld v0.5</h2>
      <button class="btn" onclick="startGame()">Play Solo</button>
      <button class="btn" onclick="showModal('multiplayer-modal')">Multiplayer</button>
      <button class="btn" onclick="showModal('settings-modal')">Settings</button>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal interactive">
      <h2>Settings</h2>
      <div class="input-group">
        <label>FOV: <span id="fov-val">75</span></label>
        <input type="range" id="fov-slider" min="50" max="110" value="75" oninput="updateSettings()">
      </div>
      <div class="input-group">
        <label>Render Distance (Chunks): <span id="render-val">2</span></label>
        <input type="range" id="render-slider" min="1" max="4" value="2" oninput="updateSettings()">
      </div>
      <button class="btn" onclick="showModal('menu-modal')">Back</button>
    </div>

    <!-- Multiplayer Modal -->
    <div id="multiplayer-modal" class="modal interactive">
      <h2>Multiplayer</h2>
      <p style="font-size: 11px; color: #aaa; margin-bottom: 10px;">Your Peer ID: <span id="my-peer-id">Connecting...</span></p>
      <div class="input-group">
        <label>Host Peer ID</label>
        <input type="text" id="host-id-input" placeholder="Paste host ID here">
      </div>
      <button class="btn" onclick="connectToHost()">Join Room</button>
      <button class="btn" onclick="showModal('menu-modal')">Back</button>
    </div>
  </div>

  <script>
    // --- AUDIO SYSTEM ---
    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      },
      playTone(freq, duration, type='square') {
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e) {}
      },
      playBreak() { this.playTone(120, 0.1, 'sawtooth'); },
      playPlace() { this.playTone(240, 0.08, 'sine'); }
    };

    // --- GAME DATA & TYPES ---
    const CHUNK_SIZE = 16;
    const CHUNK_HEIGHT = 32;
    
    const BLOCK = {
      AIR: 0, GRASS: 1, DIRT: 2, STONE: 3, 
      WOOD: 4, LEAVES: 5, GLASS: 6, BRICK: 7, PLANKS: 8
    };

    const BLOCK_COLORS = {
      [BLOCK.GRASS]: 0x557a2b,
      [BLOCK.DIRT]: 0x68492c,
      [BLOCK.STONE]: 0x737373,
      [BLOCK.WOOD]: 0x47331e,
      [BLOCK.LEAVES]: 0x2e5c1e,
      [BLOCK.GLASS]: 0xc2e8f5,
      [BLOCK.BRICK]: 0x8b3a2b,
      [BLOCK.PLANKS]: 0x9c7744
    };

    // --- GLOBALS ---
    let scene, camera, renderer, simplex;
    let chunks = {};
    let activeBlockType = BLOCK.GRASS;
    let renderDistance = 2;
    
    // Player Physics State
    const player = {
      pos: new THREE.Vector3(0, 20, 0),
      vel: new THREE.Vector3(),
      rotation: new THREE.Euler(0, 0, 0, 'YXZ'),
      onGround: false,
      height: 1.7,
      radius: 0.3
    };

    const keys = {};
    let isPointerLocked = false;
    let peer = null, peerConn = null;

    // --- SIMPLEX TERRAIN GENERATOR ---
    function getTerrainHeight(x, z) {
      const scale = 0.03;
      const n = simplex.noise2D(x * scale, z * scale);
      return Math.floor((n + 1) * 6) + 8;
    }

    function generateChunkData(cx, cz) {
      const data = new Uint8Array(CHUNK_SIZE * CHUNK_HEIGHT * CHUNK_SIZE);
      const getIdx = (x, y, z) => x + CHUNK_SIZE * (z + CHUNK_SIZE * y);

      for (let x = 0; x < CHUNK_SIZE; x++) {
        for (let z = 0; z < CHUNK_SIZE; z++) {
          const wx = cx * CHUNK_SIZE + x;
          const wz = cz * CHUNK_SIZE + z;
          const h = getTerrainHeight(wx, wz);

          for (let y = 0; y < CHUNK_HEIGHT; y++) {
            if (y > h) {
              data[getIdx(x, y, z)] = BLOCK.AIR;
            } else if (y === h) {
              data[getIdx(x, y, z)] = BLOCK.GRASS;
            } else if (y > h - 3) {
              data[getIdx(x, y, z)] = BLOCK.DIRT;
            } else {
              data[getIdx(x, y, z)] = BLOCK.STONE;
            }
          }
        }
      }
      return data;
    }

    // --- MESH GENERATOR (INSTANCED MESH PER CHUNK) ---
    function buildChunkMesh(cx, cz, data) {
      const group = new THREE.Group();
      group.position.set(cx * CHUNK_SIZE, 0, cz * CHUNK_SIZE);

      // Count block types
      const counts = {};
      const getIdx = (x, y, z) => x + CHUNK_SIZE * (z + CHUNK_SIZE * y);

      for (let i = 0; i < data.length; i++) {
        const type = data[i];
        if (type !== BLOCK.AIR) {
          counts[type] = (counts[type] || 0) + 1;
        }
      }

      const instancedMeshes = {};
      const geom = new THREE.BoxGeometry(1, 1, 1);

      for (const type in counts) {
        const mat = new THREE.MeshLambertMaterial({
          color: BLOCK_COLORS[type],
          transparent: type == BLOCK.GLASS,
          opacity: type == BLOCK.GLASS ? 0.6 : 1.0
        });
        const im = new THREE.InstancedMesh(geom, mat, counts[type]);
        instancedMeshes[type] = { mesh: im, count: 0 };
        group.add(im);
      }

      const dummy = new THREE.Object3D();
      for (let x = 0; x < CHUNK_SIZE; x++) {
        for (let y = 0; y < CHUNK_HEIGHT; y++) {
          for (let z = 0; z < CHUNK_SIZE; z++) {
            const type = data[getIdx(x, y, z)];
            if (type !== BLOCK.AIR) {
              const imObj = instancedMeshes[type];
              dummy.position.set(x + 0.5, y + 0.5, z + 0.5);
              dummy.updateMatrix();
              imObj.mesh.setMatrixAt(imObj.count++, dummy.matrix);
            }
          }
        }
      }

      return group;
    }

    function getBlock(wx, wy, wz) {
      if (wy < 0 || wy >= CHUNK_HEIGHT) return BLOCK.AIR;
      const cx = Math.floor(wx / CHUNK_SIZE);
      const cz = Math.floor(wz / CHUNK_SIZE);
      const key = `${cx},${cz}`;
      if (!chunks[key]) return BLOCK.AIR;

      const lx = ((wx % CHUNK_SIZE) + CHUNK_SIZE) % CHUNK_SIZE;
      const lz = ((wz % CHUNK_SIZE) + CHUNK_SIZE) % CHUNK_SIZE;
      const idx = lx + CHUNK_SIZE * (lz + CHUNK_SIZE * wy);
      return chunks[key].data[idx];
    }

    function setBlock(wx, wy, wz, type) {
      if (wy < 0 || wy >= CHUNK_HEIGHT) return;
      const cx = Math.floor(wx / CHUNK_SIZE);
      const cz = Math.floor(wz / CHUNK_SIZE);
      const key = `${cx},${cz}`;
      if (!chunks[key]) return;

      const lx = ((wx % CHUNK_SIZE) + CHUNK_SIZE) % CHUNK_SIZE;
      const lz = ((wz % CHUNK_SIZE) + CHUNK_SIZE) % CHUNK_SIZE;
      const idx = lx + CHUNK_SIZE * (lz + CHUNK_SIZE * wy);

      chunks[key].data[idx] = type;

      // Rebuild Chunk Mesh
      scene.remove(chunks[key].mesh);
      chunks[key].mesh = buildChunkMesh(cx, cz, chunks[key].data);
      scene.add(chunks[key].mesh);

      // Broadcast if connected to multiplayer
      if (peerConn && peerConn.open) {
        peerConn.send({ type: 'BLOCK_UPDATE', wx, wy, wz, blockType: type });
      }
    }

    // --- GAME INITIALIZATION ---
    function init() {
      simplex = new SimplexNoise();

      // Scene setup
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87ceeb);
      scene.fog = new THREE.FogExp2(0x87ceeb, 0.02);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      document.getElementById('game-container').appendChild(renderer.domElement);

      // Lights
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
      dirLight.position.set(50, 80, 30);
      scene.add(dirLight);

      // Event Listeners
      window.addEventListener('resize', onWindowResize);
      setupControls();
      setupMobileEvents();
      initPeerJS();
    }

    function loadChunksAroundPlayer() {
      const pcx = Math.floor(player.pos.x / CHUNK_SIZE);
      const pcz = Math.floor(player.pos.z / CHUNK_SIZE);

      for (let x = -renderDistance; x <= renderDistance; x++) {
        for (let z = -renderDistance; z <= renderDistance; z++) {
          const cx = pcx + x;
          const cz = pcz + z;
          const key = `${cx},${cz}`;

          if (!chunks[key]) {
            const data = generateChunkData(cx, cz);
            const mesh = buildChunkMesh(cx, cz, data);
            scene.add(mesh);
            chunks[key] = { data, mesh };
          }
        }
      }
    }

    // --- CONTROL HANDLERS ---
    function setupControls() {
      document.addEventListener('keydown', (e) => {
        keys[e.code] = true;
        if (e.code.startsWith('Digit')) {
          const num = parseInt(e.code.replace('Digit', ''));
          if (num >= 1 && num <= 8) selectHotbarSlot(num);
        }
      });

      document.addEventListener('keyup', (e) => keys[e.code] = false);

      document.addEventListener('mousemove', (e) => {
        if (!isPointerLocked) return;
        const sens = 0.002;
        player.rotation.y -= e.movementX * sens;
        player.rotation.x -= e.movementY * sens;
        player.rotation.x = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, player.rotation.x));
      });

      document.addEventListener('mousedown', (e) => {
        if (!isPointerLocked) return;
        AudioEngine.init();
        if (e.button === 0) performRaycast(true);  // Break Block
        if (e.button === 2) performRaycast(false); // Place Block
      });

      // Context menu disable for right click
      window.addEventListener('contextmenu', e => e.preventDefault());

      // Hotbar Slot Click Setup
      document.querySelectorAll('.slot').forEach(slot => {
        slot.addEventListener('click', () => {
          selectHotbarSlot(parseInt(slot.dataset.block));
        });
      });
    }

    function selectHotbarSlot(index) {
      document.querySelectorAll('.slot').forEach(s => s.classList.remove('selected'));
      const active = document.querySelector(`.slot[data-block="${index}"]`);
      if (active) {
        active.classList.add('selected');
        activeBlockType = index;
      }
    }

    // Mobile Control Listeners
    function setupMobileEvents() {
      const knob = document.getElementById('joystick-knob');
      const zone = document.getElementById('joystick-zone');
      let touchId = null;
      let startX = 0, startY = 0;

      zone.addEventListener('touchstart', (e) => {
        const touch = e.changedTouches[0];
        touchId = touch.identifier;
        startX = touch.clientX;
        startY = touch.clientY;
      });

      zone.addEventListener('touchmove', (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
          if (e.changedTouches[i].identifier === touchId) {
            const touch = e.changedTouches[i];
            const dx = touch.clientX - startX;
            const dy = touch.clientY - startY;
            const dist = Math.min(Math.hypot(dx, dy), 40);
            const angle = Math.atan2(dy, dx);
            
            const mx = Math.cos(angle) * dist;
            const my = Math.sin(angle) * dist;

            knob.style.transform = `translate(${mx}px, ${my}px)`;

            keys['KeyW'] = my < -10;
            keys['KeyS'] = my > 10;
            keys['KeyA'] = mx < -10;
            keys['KeyD'] = mx > 10;
          }
        }
      });

      const resetJoystick = () => {
        knob.style.transform = `translate(0px, 0px)`;
        keys['KeyW'] = keys['KeyS'] = keys['KeyA'] = keys['KeyD'] = false;
      };

      zone.addEventListener('touchend', resetJoystick);
      zone.addEventListener('touchcancel', resetJoystick);

      // Mobile Buttons
      document.getElementById('btn-jump').addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (player.onGround) player.vel.y = 8;
      });

      document.getElementById('btn-break').addEventListener('touchstart', (e) => {
        e.preventDefault();
        performRaycast(true);
      });

      document.getElementById('btn-place').addEventListener('touchstart', (e) => {
        e.preventDefault();
        performRaycast(false);
      });
    }

    // --- RAYCASTING (BLOCK BREAKING/PLACING) ---
    function performRaycast(isBreak) {
      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

      const reach = 6;
      const ray = raycaster.ray;
      const pos = ray.origin.clone();
      const dir = ray.direction.clone().multiplyScalar(0.05);

      let prevBlockPos = pos.clone().floor();

      for (let i = 0; i < reach / 0.05; i++) {
        pos.add(dir);
        const bPos = pos.clone().floor();

        const block = getBlock(bPos.x, bPos.y, bPos.z);
        if (block !== BLOCK.AIR) {
          if (isBreak) {
            setBlock(bPos.x, bPos.y, bPos.z, BLOCK.AIR);
            AudioEngine.playBreak();
          } else {
            setBlock(prevBlockPos.x, prevBlockPos.y, prevBlockPos.z, activeBlockType);
            AudioEngine.playPlace();
          }
          break;
        }
        prevBlockPos = bPos;
      }
    }

    // --- PHYSICS & PLAYER MOVEMENT ---
    function updatePhysics(dt) {
      // Apply Gravity
      player.vel.y -= 22 * dt;

      // Calculate Input Directions
      const speed = 7;
      const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), player.rotation.y);
      const side = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), player.rotation.y);

      const move = new THREE.Vector3();
      if (keys['KeyW']) move.add(forward);
      if (keys['KeyS']) move.sub(forward);
      if (keys['KeyD']) move.add(side);
      if (keys['KeyA']) move.sub(side);
      
      if (move.lengthSq() > 0) move.normalize().multiplyScalar(speed);

      player.vel.x = move.x;
      player.vel.z = move.z;

      // Jump
      if (keys['Space'] && player.onGround) {
        player.vel.y = 8;
        player.onGround = false;
      }

      // X Axis Motion & Collision
      player.pos.x += player.vel.x * dt;
      if (checkCollision()) player.pos.x -= player.vel.x * dt;

      // Z Axis Motion & Collision
      player.pos.z += player.vel.z * dt;
      if (checkCollision()) player.pos.z -= player.vel.z * dt;

      // Y Axis Motion & Collision
      player.pos.y += player.vel.y * dt;
      if (checkCollision()) {
        player.pos.y -= player.vel.y * dt;
        if (player.vel.y < 0) player.onGround = true;
        player.vel.y = 0;
      } else {
        player.onGround = false;
      }

      // Sync Camera Position
      camera.position.copy(player.pos);
      camera.position.y += player.height - 0.2;
      camera.quaternion.setFromEuler(player.rotation);
    }

    function checkCollision() {
      const minX = Math.floor(player.pos.x - player.radius);
      const maxX = Math.floor(player.pos.x + player.radius);
      const minY = Math.floor(player.pos.y);
      const maxY = Math.floor(player.pos.y + player.height);
      const minZ = Math.floor(player.pos.z - player.radius);
      const maxZ = Math.floor(player.pos.z + player.radius);

      for (let x = minX; x <= maxX; x++) {
        for (let y = minY; y <= maxY; y++) {
          for (let z = minZ; z <= maxZ; z++) {
            if (getBlock(x, y, z) !== BLOCK.AIR) return true;
          }
        }
      }
      return false;
    }

    // --- GAME LOOP ---
    let lastTime = performance.now();
    function animate() {
      requestAnimationFrame(animate);

      const now = performance.now();
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;

      if (isPointerLocked || window.innerWidth <= 768) {
        updatePhysics(dt);
        loadChunksAroundPlayer();
      }

      renderer.render(scene, camera);
    }

    // --- MULTIPLAYER (PEERJS) ---
    function initPeerJS() {
      peer = new Peer();
      peer.on('open', (id) => {
        document.getElementById('my-peer-id').textContent = id;
      });

      peer.on('connection', (conn) => {
        peerConn = conn;
        setupPeerEvents();
      });
    }

    function connectToHost() {
      const hostId = document.getElementById('host-id-input').value.trim();
      if (!hostId) return;
      peerConn = peer.connect(hostId);
      setupPeerEvents();
      startGame();
    }

    function setupPeerEvents() {
      peerConn.on('data', (data) => {
        if (data.type === 'BLOCK_UPDATE') {
          setBlock(data.wx, data.wy, data.wz, data.blockType);
        }
      });
    }

    // --- UI INTERACTION & SETTINGS ---
    function startGame() {
      hideModals();
      AudioEngine.init();

      // Request Pointer Lock on Desktop
      if (window.innerWidth > 768) {
        renderer.domElement.requestPointerLock();
      }
    }

    document.addEventListener('pointerlockchange', () => {
      isPointerLocked = (document.pointerLockElement === renderer.domElement);
      if (!isPointerLocked && window.innerWidth > 768) {
        showModal('menu-modal');
      }
    });

    function showModal(id) {
      document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function hideModals() {
      document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
    }

    function updateSettings() {
      const fov = document.getElementById('fov-slider').value;
      renderDistance = parseInt(document.getElementById('render-slider').value);

      document.getElementById('fov-val').textContent = fov;
      document.getElementById('render-val').textContent = renderDistance;

      if (camera) {
        camera.fov = parseInt(fov);
        camera.updateProjectionMatrix();
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // Start Engine On Load
    window.onload = () => {
      init();
      animate();
    };
  </script>
</body>
</html>
