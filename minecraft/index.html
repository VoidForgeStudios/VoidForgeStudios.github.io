<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BlockWorld v0.1</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game"></div>
  <div id="crosshair">+</div>
  <div id="hud">
    <div id="status">BlockWorld v0.1</div>
    <div id="hotbar"></div>
  </div>
  <div id="help">
    <b>BlockWorld v0.1</b><br>
    Click to play • WASD move • Space jump • Left click break • Right click place<br>
    1–4 select block • Esc unlock mouse
  </div>
  <div id="start">
    <h1>BlockWorld</h1>
    <p>Minecraft-style voxel prototype</p>
    <button id="play">PLAY</button>
  </div>
  <script type="module" src="game.js"></script>
</body>
</html>
