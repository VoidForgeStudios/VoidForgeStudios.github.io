<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>
<meta name="theme-color" content="#060b14">
<title>Snake Arena</title>

<style>
:root {
  --bg: #060b14;
  --panel: rgba(13, 22, 37, .88);
  --panel-2: rgba(255, 255, 255, .055);
  --border: rgba(255, 255, 255, .11);
  --text: #f2f7ff;
  --muted: #8da0b7;
  --green: #35e99a;
  --blue: #5ba9ff;
  --yellow: #ffd166;
  --red: #ff5c75;
  --purple: #b681ff;
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  min-height: 100%;
  margin: 0;
}

body {
  min-height: 100vh;
  overflow: hidden;
  color: var(--text);
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:
    radial-gradient(
      circle at 50% -10%,
      #17365d 0,
      transparent 45%
    ),
    var(--bg);
}

button,
input {
  font: inherit;
}

button {
  border: 0;
}

.app {
  width: min(1250px, 100%);
  min-height: 100vh;
  margin: auto;
  padding: 16px;

  display: grid;
  grid-template-rows: auto auto 1fr;
  gap: 12px;
}

.topbar,
.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 18px;

  box-shadow:
    0 25px 80px rgba(0, 0, 0, .35);

  backdrop-filter: blur(18px);
}

.topbar {
  min-height: 60px;
  padding: 12px 16px;

  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo {
  width: 34px;
  height: 34px;
  border-radius: 10px;

  display: grid;
  place-items: center;

  color: #04100a;
  font-weight: 900;

  background: var(--green);
  box-shadow: 0 0 25px rgba(53, 233, 154, .35);
}

.title {
  font-weight: 800;
  letter-spacing: .04em;
}

.subtitle {
  color: var(--muted);
  font-size: 12px;
}

.connection {
  color: var(--muted);
  font-size: 12px;
}

.connection.online {
  color: var(--green);
}

.main {
  min-height: 0;

  display: grid;
  grid-template-columns: minmax(0, 1fr) 250px;
  gap: 12px;
}

.arena {
  min-width: 0;
  min-height: 0;
  position: relative;

  display: grid;
  place-items: center;

  padding: 6px;

  border: 1px solid var(--border);
  border-radius: 22px;

  background: #030810;
  box-shadow:
    inset 0 0 70px rgba(0, 0, 0, .5),
    0 30px 100px rgba(0, 0, 0, .45);
}

canvas {
  display: block;

  width: 100%;
  height: 100%;

  border-radius: 16px;
}

.sidebar {
  min-height: 0;

  display: flex;
  flex-direction: column;
  gap: 12px;
}

.panel {
  padding: 14px;
}

.panel h2 {
  margin: 0 0 12px;

  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: .13em;
  color: var(--muted);
}

.leaderboard {
  display: grid;
  gap: 7px;
}

.player {
  display: grid;
  grid-template-columns: 28px 1fr auto;
  gap: 8px;
  align-items: center;

  padding: 9px;

  border-radius: 10px;
  background: var(--panel-2);
}

.player.dead {
  opacity: .38;
}

.rank {
  color: var(--muted);
  font-size: 11px;
}

.player-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;

  font-size: 13px;
  font-weight: 700;
}

.player-score {
  font-size: 13px;
  font-weight: 800;
}

.effects {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.effect {
  padding: 4px 7px;
  border-radius: 7px;

  font-size: 10px;
  font-weight: 800;

  background: var(--panel-2);
}

.help {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.7;
}

.overlay {
  position: absolute;
  inset: 6px;

  display: grid;
  place-items: center;

  border-radius: 16px;

  background: rgba(3, 8, 16, .82);
  backdrop-filter: blur(12px);

  z-index: 5;
}

.overlay.hidden {
  display: none;
}

.card {
  width: min(430px, 90%);

  padding: 30px;

  border-radius: 20px;

  text-align: center;

  border: 1px solid var(--border);
  background: var(--panel);

  box-shadow: 0 30px 90px rgba(0, 0, 0, .55);
}

.card h1 {
  margin: 5px 0 10px;
  font-size: 30px;
}

.card p {
  color: var(--muted);
  line-height: 1.6;
}

.form {
  display: flex;
  gap: 7px;
  margin-top: 20px;
}

input {
  min-width: 0;
  flex: 1;

  padding: 12px 13px;

  border: 1px solid var(--border);
  border-radius: 10px;

  outline: 0;

  color: var(--text);
  background: rgba(255,255,255,.06);
}

input:focus {
  border-color: var(--green);
}

.primary {
  padding: 12px 17px;

  color: #04100a;
  font-weight: 800;

  border-radius: 10px;
  cursor: pointer;

  background: var(--green);
}

.secondary {
  margin-top: 8px;

  padding: 9px 13px;

  color: var(--text);
  font-weight: 700;

  border: 1px solid var(--border);
  border-radius: 9px;

  background: var(--panel-2);
  cursor: pointer;
}

#mobileControls {
  display: none;
}

@media (max-width: 850px) {
  body {
    overflow: auto;
  }

  .app {
    min-height: 100svh;
  }

  .main {
    grid-template-columns: 1fr;
    grid-template-rows: minmax(400px, 1fr) auto;
  }

  .sidebar {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  .panel:last-child {
    display: none;
  }
}

@media (max-width: 560px) {
  .app {
    padding: 8px;
  }

  .topbar {
    min-height: 52px;
  }

  .subtitle {
    display: none;
  }

  .main {
    grid-template-rows: minmax(330px, 60vh) auto;
  }

  .sidebar {
    grid-template-columns: 1fr;
  }

  #mobileControls {
    display: grid;

    grid-template-columns: repeat(3, 48px);
    grid-template-rows: repeat(2, 48px);

    justify-content: center;
    gap: 5px;

    margin-top: 8px;
  }

  #mobileControls button {
    color: var(--text);
    border-radius: 10px;
    background: rgba(255,255,255,.08);
  }

  #mobileControls button:nth-child(1) {
    grid-column: 2;
  }

  #mobileControls button:nth-child(2) {
    grid-column: 1;
    grid-row: 2;
  }

  #mobileControls button:nth-child(3) {
    grid-column: 2;
    grid-row: 2;
  }

  #mobileControls button:nth-child(4) {
    grid-column: 3;
    grid-row: 2;
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="logo">S</div>

      <div>
        <div class="title">Snake Arena</div>
        <div class="subtitle">
          Server-authoritative multiplayer
        </div>
      </div>
    </div>

    <div id="connection" class="connection">
      Connecting…
    </div>
  </header>

  <main class="main">

    <section class="arena">

      <canvas id="game"></canvas>

      <div id="overlay" class="overlay">
        <div class="card">

          <div class="subtitle">
            GLOBAL ARENA
          </div>

          <h1 id="overlayTitle">
            Enter the arena
          </h1>

          <p id="overlayText">
            Choose a username to join the live multiplayer game.
          </p>

          <form id="joinForm" class="form">
            <input
              id="username"
              maxlength="16"
              autocomplete="nickname"
              placeholder="Username"
              required
            >

            <button class="primary">
              Join
            </button>
          </form>

          <button
            id="retry"
            class="secondary"
            hidden
          >
            Retry
          </button>

        </div>
      </div>

      <div id="mobileControls">
        <button data-direction="up">▲</button>
        <button data-direction="left">◀</button>
        <button data-direction="down">▼</button>
        <button data-direction="right">▶</button>
      </div>

    </section>

    <aside class="sidebar">

      <section class="panel">
        <h2>Leaderboard</h2>
        <div id="leaderboard" class="leaderboard"></div>
      </section>

      <section class="panel">
        <h2>Controls</h2>

        <div class="help">
          <strong>Move</strong><br>
          WASD / Arrow Keys
          <br><br>

          <strong>Power-ups</strong><br>
          ⚡ Speed<br>
          ◇ Reverse controls<br>
          ✦ 2× points
        </div>
      </section>

    </aside>

  </main>
</div>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script>
"use strict";

const socket = io("https://snake-arena-server.onrender.com", {
  transports: ["websocket", "polling"]
});

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d", {
  alpha: false,
  desynchronized: true
});

const overlay = document.getElementById("overlay");
const overlayTitle = document.getElementById("overlayTitle");
const overlayText = document.getElementById("overlayText");

const joinForm = document.getElementById("joinForm");
const usernameInput = document.getElementById("username");
const retryButton = document.getElementById("retry");

const connection = document.getElementById("connection");
const leaderboard = document.getElementById("leaderboard");

const state = {
  id: null,
  username: null,

  grid: {
    width: 80,
    height: 50
  },

  snakes: new Map(),
  food: new Map(),
  powerups: new Map(),

  leaderboard: [],

  lastServerTick: 0,
  renderTime: 0,

  cellSize: 10,
  offsetX: 0,
  offsetY: 0,

  // Smooth follow camera
  cameraX: 40,
  cameraY: 25,
  cameraReady: false,
  zoom: 2.15,
  baseCellSize: 10,

  // Smooth server-state interpolation
  previousSnakes: new Map(),
  stateReceivedAt: performance.now(),
  interpolationMs: 90,

  // Mouse follower
  mouse: {
    x: 0,
    y: 0,
    active: false
  },
  lastMouseDirection: null
};

function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = Math.floor(rect.width * dpr);
  canvas.height = Math.floor(rect.height * dpr);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  state.baseCellSize = Math.max(4, Math.min(
    rect.width / 18,
    rect.height / 12
  ));

  state.cellSize = state.baseCellSize * state.zoom;
  state.offsetX = rect.width / 2;
  state.offsetY = rect.height / 2;
}


new ResizeObserver(resizeCanvas)
  .observe(canvas);

window.addEventListener(
  "resize",
  resizeCanvas
);

function setOverlay(
  title,
  text,
  showForm = false
) {
  overlayTitle.textContent = title;
  overlayText.textContent = text;

  joinForm.hidden = !showForm;
  retryButton.hidden = showForm;

  overlay.classList.remove("hidden");
}

function hideOverlay() {
  overlay.classList.add("hidden");
}

function setConnection(online) {
  connection.textContent =
    online ? "● Connected" : "○ Disconnected";

  connection.classList.toggle(
    "online",
    online
  );
}

socket.on("connect", () => {
  setConnection(true);

  if (state.username) {
    socket.emit("join", {
      username: state.username
    });
  } else {
    setOverlay(
      "Enter the arena",
      "Choose a username to join the live multiplayer game.",
      true
    );
  }
});

socket.on("disconnect", () => {
  setConnection(false);

  setOverlay(
    "Connection lost",
    "The connection to the game server was lost.",
    false
  );

  retryButton.hidden = false;
});

socket.on("connect_error", () => {
  setConnection(false);

  setOverlay(
    "Server unavailable",
    "Unable to connect to the multiplayer server.",
    false
  );

  retryButton.hidden = false;
});

socket.on("hello", data => {
  if (data.grid) {
    state.grid = data.grid;
    resizeCanvas();
  }
});

socket.on("joinError", data => {
  setOverlay(
    "Unable to join",
    data.message || "Unable to join the arena.",
    true
  );
});

socket.on("joined", data => {
  state.id = data.id;
  state.username = data.username;

  hideOverlay();
});

socket.on("state", packet => {
  applyState(packet);
});

function applyState(packet) {
  const now = performance.now();
  const oldSnakes = state.snakes;
  state.previousSnakes = new Map(oldSnakes);
  state.stateReceivedAt = now;

  if (packet.full) {
    const snapshot = packet.state;

    state.lastServerTick =
      snapshot.tick;

    state.grid =
      snapshot.grid;

    replaceCollection(
      state.snakes,
      snapshot.snakes,
      snake => snake.id
    );

    replaceCollection(
      state.food,
      snapshot.food,
      item => item.id
    );

    replaceCollection(
      state.powerups,
      snapshot.powerups,
      item => item.id
    );

    state.leaderboard =
      snapshot.leaderboard;

    resizeCanvas();
    updateLeaderboard();

    return;
  }

  state.lastServerTick =
    packet.tick;

  replaceCollection(
    state.snakes,
    packet.snakes,
    snake => snake.id
  );

  replaceCollection(
    state.food,
    packet.food,
    item => item.id
  );

  replaceCollection(
    state.powerups,
    packet.powerups,
    item => item.id
  );

  state.leaderboard =
    packet.leaderboard;

  updateLeaderboard();

  const me = state.snakes.get(state.id);

  if (
    state.id &&
    me &&
    !me.alive
  ) {
    setOverlay(
      "You crashed",
      `Final score: ${me.score}. Reconnect to play again.`,
      false
    );
  }
}

function replaceCollection(
  map,
  array,
  getId
) {
  const nextIds = new Set();

  for (const item of array || []) {
    const id = getId(item);

    nextIds.add(id);
    map.set(id, item);
  }

  for (const id of map.keys()) {
    if (!nextIds.has(id)) {
      map.delete(id);
    }
  }
}

function updateLeaderboard() {
  leaderboard.innerHTML = "";

  for (
    let i = 0;
    i < state.leaderboard.length;
    i++
  ) {
    const player =
      state.leaderboard[i];

    const row =
      document.createElement("div");

    row.className =
      "player" +
      (player.alive ? "" : " dead");

    const rank =
      document.createElement("div");

    rank.className = "rank";
    rank.textContent =
      `#${i + 1}`;

    const name =
      document.createElement("div");

    name.className =
      "player-name";

    name.textContent =
      player.username +
      (player.username === state.username ? " · YOU" : "") +
      (player.bot ? " · BOT" : "");

    const score =
      document.createElement("div");

    score.className =
      "player-score";

    score.textContent =
      player.score;

    row.append(
      rank,
      name,
      score
    );

    leaderboard.appendChild(row);
  }
}

function sendDirection(direction) {
  if (!socket.connected) return;

  socket.emit("input", {
    direction
  });
}

const keyMap = {
  ArrowUp: "up",
  ArrowDown: "down",
  ArrowLeft: "left",
  ArrowRight: "right",

  w: "up",
  W: "up",
  s: "down",
  S: "down",
  a: "left",
  A: "left",
  d: "right",
  D: "right"
};

window.addEventListener("keydown", event => {
  const direction =
    keyMap[event.key];

  if (!direction) return;

  event.preventDefault();

  sendDirection(direction);
});

document
  .querySelectorAll("#mobileControls button")
  .forEach(button => {
    button.addEventListener(
      "pointerdown",
      event => {
        event.preventDefault();

        sendDirection(
          button.dataset.direction
        );
      }
    );
  });

canvas.addEventListener("pointermove", event => {
  const rect = canvas.getBoundingClientRect();
  state.mouse.x = event.clientX - rect.left;
  state.mouse.y = event.clientY - rect.top;
  state.mouse.active = true;

  if (event.pointerType === "mouse") {
    updateMouseDirection();
  }
});

canvas.addEventListener("pointerleave", () => {
  state.mouse.active = false;
});

function updateMouseDirection() {
  if (!socket.connected || !state.id) return;
  const me = state.snakes.get(state.id);
  if (!me?.alive || !me.body?.length) return;

  const head = { x: me.body[0].x + .5, y: me.body[0].y + .5 };
  const target = screenToWorld(state.mouse.x, state.mouse.y);
  const dx = target.x - head.x;
  const dy = target.y - head.y;
  if (Math.hypot(dx, dy) < .3) return;

  // Server movement remains grid-based; the renderer is smooth.
  const direction = Math.abs(dx) >= Math.abs(dy)
    ? (dx >= 0 ? "right" : "left")
    : (dy >= 0 ? "down" : "up");

  if (direction !== state.lastMouseDirection) {
    state.lastMouseDirection = direction;
    sendDirection(direction);
  }
}

joinForm.addEventListener(
  "submit",
  event => {
    event.preventDefault();

    const username =
      usernameInput.value
        .trim()
        .slice(0, 16);

    if (!username) {
      usernameInput.focus();
      return;
    }

    state.username = username;

    socket.emit("join", {
      username
    });
  }
);

retryButton.addEventListener(
  "click",
  () => {
    if (!socket.connected) {
      socket.connect();
    } else if (state.username) {
      socket.emit("join", {
        username: state.username
      });
    }
  }
);

function roundRect(
  x,
  y,
  width,
  height,
  radius
) {
  ctx.beginPath();

  ctx.roundRect(
    x,
    y,
    width,
    height,
    radius
  );

  ctx.fill();
}

function getInterpolatedSnake(snake) {
  const previous = state.previousSnakes.get(snake.id);
  if (!previous || !previous.body || !snake.body) return snake;

  const t = Math.min(1, (performance.now() - state.stateReceivedAt) / state.interpolationMs);
  const body = snake.body.map((segment, i) => {
    const old = previous.body[i] || segment;
    return {
      x: old.x + (segment.x - old.x) * t,
      y: old.y + (segment.y - old.y) * t
    };
  });

  return { ...snake, body };
}

function worldToScreen(x, y) {
  return {
    x: state.offsetX + (x - state.cameraX) * state.cellSize,
    y: state.offsetY + (y - state.cameraY) * state.cellSize
  };
}

function screenToWorld(x, y) {
  return {
    x: state.cameraX + (x - state.offsetX) / state.cellSize,
    y: state.cameraY + (y - state.offsetY) / state.cellSize
  };
}

function drawBackground(width, height) {
  ctx.fillStyle = "#030810";
  ctx.fillRect(0, 0, width, height);

  const halfW = width / (2 * state.cellSize) + 2;
  const halfH = height / (2 * state.cellSize) + 2;
  const left = Math.floor(state.cameraX - halfW);
  const right = Math.ceil(state.cameraX + halfW);
  const top = Math.floor(state.cameraY - halfH);
  const bottom = Math.ceil(state.cameraY + halfH);

  ctx.strokeStyle = "rgba(255,255,255,.055)";
  ctx.lineWidth = 1;

  for (let x = left; x <= right; x++) {
    const p = worldToScreen(x, 0);
    ctx.beginPath();
    ctx.moveTo(Math.round(p.x) + .5, 0);
    ctx.lineTo(Math.round(p.x) + .5, height);
    ctx.stroke();
  }

  for (let y = top; y <= bottom; y++) {
    const p = worldToScreen(0, y);
    ctx.beginPath();
    ctx.moveTo(0, Math.round(p.y) + .5);
    ctx.lineTo(width, Math.round(p.y) + .5);
    ctx.stroke();
  }

  // Arena border
  const tl = worldToScreen(0, 0);
  const br = worldToScreen(state.grid.width, state.grid.height);
  ctx.strokeStyle = "rgba(53,233,154,.22)";
  ctx.lineWidth = 2;
  ctx.strokeRect(tl.x, tl.y, br.x - tl.x, br.y - tl.y);
}

function drawFood() {
  ctx.save();
  for (const food of state.food.values()) {
    const p = worldToScreen(food.x + .5, food.y + .5);
    if (p.x < -30 || p.y < -30 || p.x > canvas.clientWidth + 30 || p.y > canvas.clientHeight + 30) continue;

    ctx.fillStyle = "#ff5c75";
    ctx.shadowColor = "#ff5c75";
    ctx.shadowBlur = Math.min(22, state.cellSize);
    ctx.beginPath();
    ctx.arc(p.x, p.y, state.cellSize * .23, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawPowerups() {
  const colors = { speed: "#b681ff", reverse: "#5ba9ff", multiplier: "#ffd166" };
  const glyphs = { speed: "⚡", reverse: "↺", multiplier: "2×" };

  ctx.save();
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = `800 ${Math.max(9, state.cellSize * .48)}px system-ui`;

  for (const power of state.powerups.values()) {
    const p = worldToScreen(power.x + .5, power.y + .5);
    const size = state.cellSize * .64;
    const x = p.x - size / 2;
    const y = p.y - size / 2;
    const color = colors[power.type] || "#fff";

    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = Math.min(18, state.cellSize);
    roundRect(x, y, size, size, state.cellSize * .12);
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#07101c";
    ctx.fillText(glyphs[power.type] || "✦", p.x, p.y);
  }
  ctx.restore();
}

function drawSnakeEyes(snake, head) {
  if (!head) return;

  let dx = 1, dy = 0;
  if (snake.body.length > 1) {
    dx = head.x - snake.body[1].x;
    dy = head.y - snake.body[1].y;
  }

  const len = Math.hypot(dx, dy) || 1;
  dx /= len;
  dy /= len;
  const px = -dy, py = dx;
  const forward = state.cellSize * .22;
  const side = state.cellSize * .15;
  const eye = Math.max(1.5, state.cellSize * .055);
  const c = worldToScreen(head.x + .5, head.y + .5);

  ctx.fillStyle = "#06100b";
  for (const sign of [-1, 1]) {
    ctx.beginPath();
    ctx.arc(
      c.x + dx * forward + px * side * sign,
      c.y + dy * forward + py * side * sign,
      eye, 0, Math.PI * 2
    );
    ctx.fill();
  }
}

function drawSnakes() {
  const colors = { p1: "#35e99a", p2: "#5ba9ff", bot: "#ffd166" };

  for (const rawSnake of state.snakes.values()) {
    const snake = getInterpolatedSnake(rawSnake);
    if (!snake.body || !snake.body.length) continue;

    const color = colors[snake.bot ? "bot" : snake.id === state.id ? "p1" : "p2"] || "#fff";

    ctx.save();
    ctx.globalAlpha = snake.alive ? 1 : .25;

    for (let i = snake.body.length - 1; i >= 0; i--) {
      const segment = snake.body[i];
      const isHead = i === 0;
      const padding = isHead ? state.cellSize * .06 : state.cellSize * .11;
      const p = worldToScreen(segment.x, segment.y);

      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = isHead ? Math.min(20, state.cellSize) : Math.min(8, state.cellSize);
      roundRect(
        p.x + padding,
        p.y + padding,
        state.cellSize - padding * 2,
        state.cellSize - padding * 2,
        isHead ? state.cellSize * .22 : state.cellSize * .13
      );
    }

    ctx.shadowBlur = 0;
    drawSnakeEyes(snake, snake.body[0]);

    if (snake.effects && snake.effects.speed > 0) {
      const h = worldToScreen(snake.body[0].x + .5, snake.body[0].y + .5);
      ctx.strokeStyle = "#b681ff";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(h.x, h.y, state.cellSize * .48, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.restore();
  }
}

function drawMouseFollower() {
  if (!state.mouse.active || !state.id) return;
  const me = state.snakes.get(state.id);
  if (!me || !me.body?.length) return;

  const p = screenToWorld(state.mouse.x, state.mouse.y);
  const head = { x: me.body[0].x + .5, y: me.body[0].y + .5 };
  const target = { x: Math.max(0, Math.min(state.grid.width, p.x)), y: Math.max(0, Math.min(state.grid.height, p.y)) };
  const dx = target.x - head.x;
  const dy = target.y - head.y;
  if (Math.hypot(dx, dy) < .35) return;

  ctx.save();
  ctx.strokeStyle = "rgba(53,233,154,.35)";
  ctx.lineWidth = 1.5;
  ctx.setLineDash([5, 7]);
  ctx.beginPath();
  ctx.moveTo(state.mouse.x, state.mouse.y);
  const hp = worldToScreen(head.x, head.y);
  ctx.lineTo(hp.x, hp.y);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle = "rgba(53,233,154,.9)";
  ctx.beginPath();
  ctx.arc(state.mouse.x, state.mouse.y, Math.max(7, state.cellSize * .18), 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

function render() {
  const rect = canvas.getBoundingClientRect();
  const width = rect.width;
  const height = rect.height;

  state.cellSize = state.baseCellSize * state.zoom;

  const me = state.id ? state.snakes.get(state.id) : null;
  if (me?.body?.length) {
    const sm = getInterpolatedSnake(me);
    const head = sm.body[0];
    const targetX = head.x + .5;
    const targetY = head.y + .5;

    if (!state.cameraReady) {
      state.cameraX = targetX;
      state.cameraY = targetY;
      state.cameraReady = true;
    } else {
      const ease = 1 - Math.pow(.001, 1 / 60);
      state.cameraX += (targetX - state.cameraX) * ease;
      state.cameraY += (targetY - state.cameraY) * ease;
    }
  }

  // Keep the camera from showing outside the arena when possible.
  const halfW = width / (2 * state.cellSize);
  const halfH = height / (2 * state.cellSize);
  if (state.grid.width / 2 > halfW) {
    state.cameraX = Math.max(halfW, Math.min(state.grid.width - halfW, state.cameraX));
  }
  if (state.grid.height / 2 > halfH) {
    state.cameraY = Math.max(halfH, Math.min(state.grid.height - halfH, state.cameraY));
  }

  drawBackground(width, height);
  drawFood();
  drawPowerups();
  drawSnakes();
  drawMouseFollower();
}


function animationLoop(time) {
  state.renderTime = time;

  render();

  requestAnimationFrame(
    animationLoop
  );
}

resizeCanvas();
setInterval(updateMouseDirection, 55);
requestAnimationFrame(animationLoop);
</script>

</body>
</html>
