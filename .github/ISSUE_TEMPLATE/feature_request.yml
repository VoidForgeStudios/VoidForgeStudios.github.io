name: Feature Request
description: Suggest a new feature or improvement for a VoidForge Studios project.
title: "[Feature]: "
labels:
  - enhancement

body:
  - type: markdown
    attributes:
      value: |
        ## VoidForge Studios — Feature Request

        Thanks for helping improve this project!
        Please provide enough detail for the team to understand and evaluate your idea.

  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What problem would this feature solve?
      placeholder: |
        Currently, users/players/developers cannot...
        This makes it difficult to...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Feature
      description: Describe the feature or improvement you would like to see.
      placeholder: |
        I would like VoidForge to add...
        The feature should work by...
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Explain how this feature would be used.
      placeholder: |
        A user/player/developer would use this when...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What alternatives or workarounds have you tried?
      placeholder: |
        I currently work around this by...
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Suggested Priority
      description: How important do you believe this feature is?
      options:
        - Low
        - Medium
        - High
        - Critical
      default: 1
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project would this affect?
      options:
        - Gameplay
        - UI / UX
        - Performance
        - Tools
        - Modding
        - API / Backend
        - Documentation
        - Developer Experience
        - Build / Deployment
        - Other
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Add mockups, screenshots, examples, references, or technical notes.
      placeholder: |
        Links, mockups, examples, technical notes, etc.

  - type: checkboxes
    id: checklist
    attributes:
      label: Submission Checklist
      options:
        - label: I have searched existing issues and feature requests.
          required: true
        - label: This feature is relevant to the project.
          required: true
        - label: I have provided enough information to understand the proposal.
          required: true
