name: Validate VoidForge Assets

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assets:
    name: Validate local assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check launcher references
        shell: bash
        run: |
          set -e

          check_file() {
            local file="$1"

            if [ ! -f "$file" ]; then
              echo "::error::Missing referenced file: $file"
              exit 1
            fi

            echo "OK: $file"
          }

          echo "Checking core VoidForge files..."

          check_file "index.html"
          check_file "assets/launcher.js"
          check_file "games.json"
          check_file "manifest.webmanifest"
          check_file "sw.js"

          echo
          echo "Checking launcher references..."

          grep -q 'assets/launcher.js' index.html || {
            echo "::error::index.html does not reference assets/launcher.js"
            exit 1
          }

          grep -q 'sw.js' assets/launcher.js || {
            echo "::error::launcher.js does not reference sw.js"
            exit 1
          }

          grep -q 'games.json' assets/launcher.js || {
            echo "::error::launcher.js does not reference games.json"
            exit 1
          }

          echo "All core references look good."

      - name: Check game entry points
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          games = json.loads(Path("games.json").read_text())

          for game in games:
              entry = Path(game["entry"]) / "index.html"

              if not entry.is_file():
                  raise SystemExit(
                      f"Missing game entry: {entry}"
                  )

              print(f"OK: {entry}")
          PY
