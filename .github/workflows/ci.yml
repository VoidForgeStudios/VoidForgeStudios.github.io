name: VoidForge CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate VoidForge
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check required files
        shell: bash
        run: |
          set -e

          required_files=(
            "index.html"
            "games.json"
            "assets/launcher.js"
            "manifest.webmanifest"
            "sw.js"
            "minecraft/index.html"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing required file: $file"
              exit 1
            fi

            echo "OK: $file"
          done

      - name: Validate games.json
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("games.json")

          try:
              data = json.loads(path.read_text())
          except Exception as exc:
              raise SystemExit(f"Invalid games.json: {exc}")

          if not isinstance(data, list):
              raise SystemExit("games.json must contain a JSON array")

          print(f"Found {len(data)} game(s).")

          for game in data:
              if not isinstance(game, dict):
                  raise SystemExit("Every game entry must be an object")

              if "id" not in game:
                  raise SystemExit("Game is missing required 'id'")

              if "entry" not in game:
                  raise SystemExit(
                      f"Game '{game['id']}' is missing required 'entry'"
                  )

              print(f"OK: {game['id']}")
          PY

      - name: Check JavaScript syntax
        run: node --check assets/launcher.js

      - name: Check service worker syntax
        run: node --check sw.js

      - name: Check manifest JSON
        run: |
          python3 -m json.tool manifest.webmanifest > /dev/null

      - name: Check HTML files
        shell: bash
        run: |
          set -e

          html_files=(
            "index.html"
            "minecraft/index.html"
          )

          for file in "${html_files[@]}"; do
            if ! grep -qi "<html" "$file"; then
              echo "::error::$file does not appear to be valid HTML"
              exit 1
            fi

            if ! grep -qi "</html>" "$file"; then
              echo "::error::$file is missing </html>"
              exit 1
            fi

            echo "OK: $file"
          done
