name: Deploy JARVIS backend to Render

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - "server.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/render-jarvis.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Sync JARVIS secrets to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          JARVIS_ACCESS_TOKEN: ${{ secrets.JARVIS_ACCESS_TOKEN }}
          GROQ_MASTER_API_KEY: ${{ secrets.GROQ_MASTER_API_KEY }}
          GROQ_WORKER_1_API_KEY: ${{ secrets.GROQ_WORKER_1_API_KEY }}
          GROQ_WORKER_2_API_KEY: ${{ secrets.GROQ_WORKER_2_API_KEY }}
          GROQ_WORKER_3_API_KEY: ${{ secrets.GROQ_WORKER_3_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${RENDER_API_KEY}" || -z "${RENDER_SERVICE_ID}" ]]; then
            echo "RENDER_API_KEY and RENDER_SERVICE_ID GitHub secrets are required."
            exit 1
          fi

          put_env() {
            local key="$1"
            local value="$2"
            curl --fail-with-body --silent --show-error \
              --request PUT \
              --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/env-vars/${key}" \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              --header "Content-Type: application/json" \
              --data "$(node -e 'console.log(JSON.stringify({value: process.env.VALUE}))' VALUE="${value}")" \
              >/dev/null
          }

          put_env "JARVIS_ACCESS_TOKEN" "${JARVIS_ACCESS_TOKEN}"
          put_env "GROQ_MASTER_API_KEY" "${GROQ_MASTER_API_KEY}"
          put_env "GROQ_WORKER_1_API_KEY" "${GROQ_WORKER_1_API_KEY}"
          put_env "GROQ_WORKER_2_API_KEY" "${GROQ_WORKER_2_API_KEY}"
          put_env "GROQ_WORKER_3_API_KEY" "${GROQ_WORKER_3_API_KEY}"
          put_env "JARVIS_ALLOWED_ORIGIN" "https://voidforgestudios.github.io"

      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Content-Type: application/json" \
            --data '{"clearCache":"do_not_clear"}' \
            >/dev/null
          echo "Render deployment triggered."
