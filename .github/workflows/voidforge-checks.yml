name: VoidForge Checks

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Find JavaScript files
        shell: bash
        run: |
          set -e

          if [ ! -f ".gitignore" ]; then
            echo "No .gitignore found."
            exit 1
          fi

          git ls-files --cached --others --exclude-standard \
            | grep -Ei '\.js$' \
            > js-files.txt || true

          echo "JavaScript files:"
          cat js-files.txt

      - name: Validate JavaScript
        shell: bash
        run: |
          set -e

          if [ ! -s js-files.txt ]; then
            echo "No JavaScript files found."
            exit 0
          fi

          while IFS= read -r file; do
            echo "Checking $file"
            node --check "$file"
          done < js-files.txt

          echo "PASS: All JavaScript files."
