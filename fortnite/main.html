<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07101e">

<title>BattleZone</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&display=swap');

*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
}

body{
  font-family:'Barlow Condensed',Arial,sans-serif;
  color:white;
  background:
    radial-gradient(
      circle at 68% 35%,
      rgba(255,225,170,.35),
      transparent 22%
    ),
    linear-gradient(
      135deg,
      #182d54,
      #416d9a 48%,
      #d68b58
    );
}

button{
  font:inherit;
}

button:disabled{
  cursor:not-allowed;
}

.background{
  position:fixed;
  inset:0;
  z-index:-2;
  background:
    radial-gradient(
      circle at 20% 80%,
      rgba(52,126,220,.22),
      transparent 30%
    ),
    radial-gradient(
      circle at 80% 20%,
      rgba(255,180,100,.22),
      transparent 30%
    );
}

.background::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.42),
      transparent 35%,
      rgba(0,0,0,.45)
    );
}

.menu{
  width:100%;
  height:100%;
  position:relative;
}

/* =========================================================
   TOP BAR
========================================================= */

.top{
  height:82px;
  display:flex;
  align-items:center;
  padding:0 28px;

  background:
    linear-gradient(
      rgba(5,12,25,.95),
      rgba(5,12,25,0)
    );

  position:relative;
  z-index:5;
}

.logo{
  font-size:31px;
  font-weight:900;
  font-style:italic;
  letter-spacing:1px;
  text-shadow:3px 4px #111;
}

.logo span{
  color:#ffd02f;
}

nav{
  display:flex;
  margin-left:45px;
  gap:5px;
}

nav button{
  height:48px;
  padding:0 20px;

  color:white;
  background:transparent;
  border:0;

  font-size:18px;
  font-weight:900;

  cursor:pointer;

  transform:skew(-5deg);

  transition:
    background .2s,
    transform .2s;
}

nav button:hover{
  background:#ffffff18;
}

nav button.active{
  background:#ffffff18;
  border-bottom:4px solid #ffd42e;
}

.account{
  margin-left:auto;

  display:flex;
  align-items:center;
  gap:12px;
}

.vbucks{
  background:#07101dcc;
  border:1px solid #ffffff45;
  padding:9px 14px;
  border-radius:5px;
  font-weight:800;
}

.coin{
  display:inline-grid;
  place-items:center;

  width:20px;
  height:20px;

  border-radius:50%;

  background:#62d8ff;
  color:#16466d;

  margin-right:5px;
}

.avatar{
  width:43px;
  height:43px;

  display:grid;
  place-items:center;

  font-weight:900;

  background:
    linear-gradient(
      135deg,
      #202b4a,
      #d79769
    );

  border:2px solid white;
}

/* =========================================================
   CENTER
========================================================= */

.center{
  position:absolute;
  inset:82px 0 0;

  display:grid;
  place-items:center;

  text-align:center;
}

.content{
  margin-top:-30px;
}

.eyebrow{
  font-size:22px;
  letter-spacing:4px;
  font-weight:800;
}

.title{
  font-size:clamp(70px,11vw,155px);
  line-height:.8;

  margin:13px 0;

  font-weight:900;
  font-style:italic;

  text-shadow:
    6px 7px #202b43,
    12px 15px 25px #0008;
}

.tagline{
  font-size:23px;
  font-weight:800;
  letter-spacing:2px;
}

.play{
  margin-top:30px;

  padding:16px 65px;

  background:#f5c82e;
  color:#172139;

  border:3px solid white;

  font-size:29px;
  font-weight:900;
  letter-spacing:2px;

  cursor:pointer;

  clip-path:
    polygon(
      3% 0,
      100% 0,
      97% 100%,
      0 100%
    );

  transition:
    transform .2s,
    filter .2s;
}

.play:hover{
  filter:brightness(1.1);
  transform:translateY(-2px);
}

.play:disabled{
  opacity:.65;
}

/* =========================================================
   BOTTOM
========================================================= */

.bottom{
  position:absolute;

  left:24px;
  right:24px;
  bottom:20px;

  display:flex;
  justify-content:space-between;
  align-items:end;

  z-index:5;
}

.profile{
  display:flex;
  gap:12px;
  align-items:center;

  background:#07101dcc;

  padding:10px 15px;

  border:1px solid #ffffff30;
}

.pfp{
  width:48px;
  height:48px;

  display:grid;
  place-items:center;

  background:
    linear-gradient(
      135deg,
      #273557,
      #d99a71
    );

  font-size:20px;
  font-weight:900;
}

.name{
  font-size:21px;
  font-weight:900;
}

.level{
  font-size:15px;
  opacity:.75;
}

.news{
  background:#07101dcc;
  border:1px solid #ffffff30;

  padding:10px 18px;

  text-align:center;
}

.news b{
  font-size:17px;
}

.news small{
  display:block;
  opacity:.7;
}

/* =========================================================
   MATCHMAKING OVERLAY
========================================================= */

#matchmakingOverlay{
  position:fixed;
  inset:0;

  z-index:100;

  display:none;
  align-items:center;
  justify-content:center;

  background:
    radial-gradient(
      circle at center,
      rgba(45,91,145,.88),
      rgba(3,9,19,.97)
    );

  backdrop-filter:blur(12px);
}

#matchmakingOverlay.visible{
  display:flex;
}

.match-card{
  width:min(520px,92vw);

  padding:35px;

  text-align:center;

  background:
    rgba(5,13,27,.94);

  border:1px solid rgba(255,255,255,.2);

  box-shadow:
    0 30px 100px rgba(0,0,0,.55),
    inset 0 1px rgba(255,255,255,.07);
}

.match-logo{
  font-size:22px;
  font-weight:900;
  letter-spacing:4px;
  opacity:.7;
}

.match-title{
  margin:10px 0 5px;

  font-size:48px;
  font-weight:900;
  font-style:italic;
}

.match-status{
  min-height:27px;

  color:#a9b8ce;

  font-size:17px;
}

.search-animation{
  width:80px;
  height:80px;

  margin:30px auto;

  border:5px solid #ffffff20;
  border-top-color:#ffd02f;
  border-radius:50%;

  animation:spin 1s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.match-progress{
  width:100%;
  height:5px;

  margin-top:20px;

  background:#ffffff15;
  overflow:hidden;
}

.match-progress::before{
  content:"";

  display:block;

  width:40%;
  height:100%;

  background:#ffd02f;

  animation:
    searching 1.2s infinite ease-in-out;
}

@keyframes searching{
  0%{
    transform:translateX(-120%);
  }

  50%{
    transform:translateX(150%);
  }

  100%{
    transform:translateX(300%);
  }
}

.cancel{
  margin-top:30px;

  padding:12px 30px;

  background:#ffffff0d;

  color:white;

  border:1px solid #ffffff40;

  font-size:18px;
  font-weight:800;

  cursor:pointer;
}

.cancel:hover{
  background:#ffffff18;
}

/* =========================================================
   MATCH FOUND
========================================================= */

.match-found{
  display:none;
}

.match-found.visible{
  display:block;
}

.searching-content.hidden{
  display:none;
}

.match-found-title{
  color:#ffd02f;

  font-size:54px;
  font-weight:900;
  font-style:italic;

  text-shadow:3px 4px #000;
}

.players{
  margin:25px 0;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:20px;
}

.player-card{
  min-width:150px;

  padding:15px;

  background:#ffffff0b;
  border:1px solid #ffffff20;
}

.player-avatar{
  width:55px;
  height:55px;

  margin:auto;

  display:grid;
  place-items:center;

  background:
    linear-gradient(
      135deg,
      #273557,
      #d99a71
    );

  border:2px solid white;

  font-size:22px;
  font-weight:900;
}

.player-name{
  margin-top:10px;

  font-size:19px;
  font-weight:900;

  word-break:break-word;
}

.vs{
  font-size:28px;
  font-weight:900;
  color:#ffd02f;
}

/* =========================================================
   ERROR TOAST
========================================================= */

#errorBox{
  position:fixed;

  left:50%;
  bottom:30px;

  transform:
    translate(-50%,20px);

  z-index:200;

  max-width:90vw;

  padding:13px 20px;

  background:#9e2424e8;

  border:1px solid #ff8585;

  opacity:0;
  pointer-events:none;

  transition:
    opacity .3s,
    transform .3s;
}

#errorBox.visible{
  opacity:1;

  transform:
    translate(-50%,0);
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:750px){

  nav{
    display:none;
  }

  .top{
    padding:0 14px;
  }

  .logo{
    font-size:24px;
  }

  .vbucks{
    font-size:14px;
    padding:7px;
  }

  .avatar{
    width:37px;
    height:37px;
  }

  .eyebrow{
    font-size:16px;
  }

  .tagline{
    font-size:17px;
  }

  .title{
    font-size:65px;
  }

  .play{
    font-size:23px;
    padding:13px 45px;
  }

  .news{
    display:none;
  }

  .bottom{
    left:12px;
    right:12px;
  }

  .match-card{
    padding:25px 18px;
  }

  .match-title{
    font-size:38px;
  }

  .match-found-title{
    font-size:42px;
  }

  .players{
    gap:8px;
  }

  .player-card{
    min-width:120px;
  }

  .vs{
    font-size:20px;
  }
}
</style>
</head>

<body>

<div class="background"></div>

<div class="menu">

  <header class="top">

    <div class="logo">
      BATTLE<span>ZONE</span>
    </div>

    <nav>

      <button class="active">
        PLAY
      </button>

      <button>
        LOCKER
      </button>

      <button>
        SHOP
      </button>

      <button>
        BATTLE PASS
      </button>

      <button>
        QUESTS
      </button>

    </nav>

    <div class="account">

      <div class="vbucks">
        <span class="coin">V</span>
        <span id="vbucks">
          2,850
        </span>
      </div>

      <div
        id="avatar"
        class="avatar">
        ?
      </div>

    </div>

  </header>


  <main class="center">

    <section class="content">

      <div class="eyebrow">
        CHAPTER 2 • SEASON 9
      </div>

      <div class="title">
        BATTLE<br>
        ROYAL
      </div>

      <div class="tagline">
        DROP IN. SURVIVE. CONQUER.
      </div>

      <button
        id="playButton"
        class="play">
        PLAY
      </button>

    </section>

  </main>


  <footer class="bottom">

    <div class="profile">

      <div
        id="profileAvatar"
        class="pfp">
        ?
      </div>

      <div>

        <div
          id="profileName"
          class="name">
          LOADING...
        </div>

        <div
          id="profileLevel"
          class="level">
          LEVEL 1
        </div>

      </div>

    </div>


    <div class="news">

      <b>
        ONLINE SERVICES
      </b>

      <small>
        Matchmaking system online.
      </small>

    </div>

  </footer>

</div>


<!-- =======================================================
     MATCHMAKING
======================================================= -->

<div id="matchmakingOverlay">

  <div class="match-card">

    <div class="searching-content">

      <div class="match-logo">
        BATTLEZONE
      </div>

      <div class="match-title">
        FINDING MATCH
      </div>

      <div
        id="matchStatus"
        class="match-status">
        Searching for an opponent...
      </div>

      <div class="search-animation"></div>

      <div class="match-progress"></div>

      <button
        id="cancelButton"
        class="cancel">
        CANCEL
      </button>

    </div>


    <div class="match-found">

      <div class="match-found-title">
        MATCH FOUND
      </div>

      <div class="match-status">
        Preparing battle...
      </div>

      <div class="players">

        <div class="player-card">

          <div
            id="myMatchAvatar"
            class="player-avatar">
            ?
          </div>

          <div
            id="myMatchName"
            class="player-name">
            PLAYER
          </div>

        </div>

        <div class="vs">
          VS
        </div>

        <div class="player-card">

          <div
            id="enemyMatchAvatar"
            class="player-avatar">
            ?
          </div>

          <div
            id="enemyMatchName"
            class="player-name">
            PLAYER
          </div>

        </div>

      </div>

    </div>

  </div>

</div>


<div
  id="errorBox"
  aria-live="polite">
</div>


<!-- =======================================================
     FIREBASE COMPAT SDK
======================================================= -->

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>


<!-- =======================================================
     YOUR PLAYER DATABASE
======================================================= -->

<script src="./js/playerdb.js"></script>

<!-- =======================================================
     MATCHMAKING
======================================================= -->

<script src="./js/matchmaking.js"></script>


<script>

"use strict";


/* =========================================================
   ELEMENTS
========================================================= */

const playButton =
  document.getElementById("playButton");

const profileName =
  document.getElementById("profileName");

const profileLevel =
  document.getElementById("profileLevel");

const avatar =
  document.getElementById("avatar");

const profileAvatar =
  document.getElementById("profileAvatar");

const vbucks =
  document.getElementById("vbucks");


/* =========================================================
   HELPERS
========================================================= */

function initials(name){

  name =
    String(name || "?").trim();

  if(!name){
    return "?";
  }

  return name
    .substring(0,2)
    .toUpperCase();
}


/* =========================================================
   LOAD REAL PLAYER
========================================================= */

if(
  !window.PlayerDB ||
  typeof PlayerDB.watchPlayer !== "function"
){

  console.error(
    "[BattleZone] PlayerDB is unavailable."
  );

}else{

  PlayerDB.watchPlayer(
    function(player){

      if(!player){

        /*
          Not authenticated.

          Return to login.
        */

        window.location.href =
          "./index.html";

        return;
      }


      const username =
        player.username ||
        player.displayName ||
        "PLAYER";


      profileName.textContent =
        username;

      profileAvatar.textContent =
        initials(username);

      avatar.textContent =
        initials(username);


      profileLevel.textContent =
        "LEVEL " +
        Number(player.level || 1);


      vbucks.textContent =
        Number(player.vbucks || 0)
          .toLocaleString();


      /*
        Tell matchmaking who the real player is.
      */

      if(
        window.Matchmaking &&
        typeof Matchmaking.setPlayer === "function"
      ){

        Matchmaking.setPlayer(player);

      }

    }
  );

}


/* =========================================================
   PLAY
========================================================= */

playButton.addEventListener(
  "click",
  async function(){

    playButton.disabled = true;

    playButton.textContent =
      "SEARCHING...";

    try{

      if(
        !window.Matchmaking
      ){

        throw new Error(
          "Matchmaking system is unavailable."
        );
      }


      await Matchmaking.start();


    }catch(error){

      console.error(error);

      showError(
        error.message ||
        "Could not start matchmaking."
      );

      playButton.disabled = false;

      playButton.textContent =
        "PLAY";
    }

  }
);


/* =========================================================
   MATCHMAKING EVENTS
========================================================= */

window.addEventListener(
  "battlezone-matchmaking-started",
  function(){

    playButton.disabled =
      true;

    playButton.textContent =
      "SEARCHING...";

  }
);


window.addEventListener(
  "battlezone-matchmaking-cancelled",
  function(){

    playButton.disabled =
      false;

    playButton.textContent =
      "PLAY";

  }
);


/* =========================================================
   ERROR
========================================================= */

function showError(message){

  const box =
    document.getElementById(
      "errorBox"
    );

  box.textContent =
    message;

  box.classList.add(
    "visible"
  );

  setTimeout(
    function(){

      box.classList.remove(
        "visible"
      );

    },
    4500
  );
}


/* =========================================================
   NAVIGATION
========================================================= */

document
  .querySelectorAll("nav button")
  .forEach(function(button){

    button.addEventListener(
      "click",
      function(){

        document
          .querySelectorAll("nav button")
          .forEach(function(item){

            item.classList.remove(
              "active"
            );

          });

        button.classList.add(
          "active"
        );

      }
    );

  });

</script>

</body>
</html>
