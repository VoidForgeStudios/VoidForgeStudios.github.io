
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07101e">
<title>BattleZone</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&display=swap');

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:'Barlow Condensed',Arial,sans-serif;
  color:#fff;
  background:#07101e;
}

body{
  user-select:none;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

/* =========================================================
   BACKGROUND
========================================================= */

.app{
  position:fixed;
  inset:0;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 70% 30%,
      rgba(255,225,170,.38),
      transparent 25%
    ),
    linear-gradient(
      135deg,
      #182d54,
      #416d9a 48%,
      #d68b58
    );
}

.app:before{
  content:"";
  position:absolute;
  inset:0;

  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.45),
      transparent 35%,
      rgba(0,0,0,.5)
    );

  pointer-events:none;
}

/* =========================================================
   TOP BAR
========================================================= */

.top{
  position:absolute;
  z-index:20;
  top:0;
  left:0;
  right:0;

  height:82px;

  display:flex;
  align-items:center;

  padding:0 28px;

  background:
    linear-gradient(
      rgba(5,12,25,.94),
      transparent
    );
}

.logo{
  font-size:31px;
  font-weight:900;
  font-style:italic;
  letter-spacing:1px;

  text-shadow:
    3px 4px #111;
}

.logo span{
  color:#ffd02f;
}

nav{
  display:flex;
  gap:5px;
  margin-left:40px;
}

nav button{
  height:48px;
  padding:0 20px;

  color:white;
  background:transparent;

  border:0;

  font-size:18px;
  font-weight:900;

  transform:skew(-5deg);

  transition:
    background .2s,
    color .2s;
}

nav button:hover,
nav button.active{
  background:#ffffff1c;
}

nav button.active{
  border-bottom:4px solid #ffd42e;
}

.account{
  margin-left:auto;

  display:flex;
  align-items:center;
  gap:12px;
}

.vbucks{
  padding:9px 14px;

  background:#07101dcc;
  border:1px solid #ffffff45;

  border-radius:5px;

  font-weight:800;
}

.coin{
  display:inline-grid;
  place-items:center;

  width:20px;
  height:20px;

  margin-right:5px;

  border-radius:50%;

  background:#62d8ff;
  color:#16466d;
}

.avatar{
  width:43px;
  height:43px;

  display:grid;
  place-items:center;

  font-weight:900;

  background:
    linear-gradient(
      135deg,
      #202b4a,
      #d79769
    );

  border:2px solid white;
}

/* =========================================================
   CENTER
========================================================= */

.center{
  position:absolute;
  z-index:2;

  inset:82px 0 0;

  display:grid;
  place-items:center;

  text-align:center;
}

.content{
  margin-top:-20px;
}

.eyebrow{
  font-size:22px;
  letter-spacing:4px;
  font-weight:800;
}

.hero-title{
  font-size:clamp(70px,11vw,155px);
  line-height:.8;

  margin:13px 0;

  font-weight:900;
  font-style:italic;

  text-shadow:
    6px 7px #202b43,
    12px 15px 25px #0008;
}

.tagline{
  font-size:23px;
  font-weight:800;
  letter-spacing:2px;
}

.play{
  margin-top:30px;

  padding:16px 65px;

  background:#f5c82e;
  color:#172139;

  border:3px solid white;

  font-size:29px;
  font-weight:900;

  letter-spacing:2px;

  clip-path:
    polygon(
      3% 0,
      100% 0,
      97% 100%,
      0 100%
    );

  transition:
    transform .2s,
    filter .2s;
}

.play:hover{
  filter:brightness(1.1);
  transform:translateY(-2px);
}

/* =========================================================
   BOTTOM PROFILE
========================================================= */

.bottom{
  position:absolute;
  z-index:10;

  left:24px;
  right:24px;
  bottom:20px;

  display:flex;
  justify-content:space-between;
  align-items:end;
}

.profile{
  display:flex;
  gap:12px;
  align-items:center;

  padding:10px 15px;

  background:#07101dcc;

  border:1px solid #ffffff30;

  backdrop-filter:blur(8px);
}

.pfp{
  width:48px;
  height:48px;

  display:grid;
  place-items:center;

  background:
    linear-gradient(
      135deg,
      #273557,
      #d99a71
    );

  font-size:20px;
  font-weight:900;
}

.name{
  font-size:21px;
  font-weight:900;
}

.level{
  font-size:15px;
  opacity:.75;
}

.news{
  padding:10px 18px;

  background:#07101dcc;
  border:1px solid #ffffff30;

  text-align:center;

  backdrop-filter:blur(8px);
}

.news b{
  font-size:17px;
}

.news small{
  display:block;
  opacity:.7;
}

/* =========================================================
   PANEL
========================================================= */

.panel{
  position:fixed;
  z-index:50;

  top:95px;
  right:25px;

  width:min(420px,calc(100vw - 30px));

  max-height:
    calc(100vh - 125px);

  overflow:auto;

  padding:20px;

  background:
    rgba(5,13,27,.94);

  border:1px solid #ffffff25;

  box-shadow:
    0 20px 70px #0008;

  backdrop-filter:blur(18px);

  transform:
    translateX(110%);

  opacity:0;
  pointer-events:none;

  transition:
    transform .35s ease,
    opacity .35s ease;
}

.panel.open{
  transform:translateX(0);
  opacity:1;
  pointer-events:auto;
}

.panel-title{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:15px;
}

.panel-title h3{
  margin:0;

  font-size:30px;
  font-weight:900;
  font-style:italic;
}

.close{
  width:35px;
  height:35px;

  border:1px solid #ffffff25;
  background:#ffffff10;
  color:white;

  font-size:20px;
}

/* =========================================================
   SEARCH
========================================================= */

.search{
  display:flex;
  gap:8px;

  margin-bottom:15px;
}

.search input{
  flex:1;

  min-width:0;

  height:46px;

  padding:0 12px;

  color:white;

  background:#111d31;

  border:1px solid #ffffff20;

  outline:none;
}

.search input:focus{
  border-color:#ffd02f;
}

.search button{
  padding:0 15px;

  border:0;

  background:#ffd02f;
  color:#172139;

  font-weight:900;
}

/* =========================================================
   PLAYER LIST
========================================================= */

.player-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.player{
  display:flex;
  align-items:center;
  gap:10px;

  padding:10px;

  background:#ffffff08;

  border:1px solid #ffffff12;

  transition:
    background .2s;
}

.player:hover{
  background:#ffffff15;
}

.player-avatar{
  width:40px;
  height:40px;

  flex:none;

  display:grid;
  place-items:center;

  background:
    linear-gradient(
      135deg,
      #273557,
      #d99a71
    );

  font-weight:900;
}

.player-info{
  flex:1;
  min-width:0;
}

.player-name{
  overflow:hidden;

  white-space:nowrap;
  text-overflow:ellipsis;

  font-size:18px;
  font-weight:900;
}

.player-level{
  color:#8292aa;
  font-size:13px;
}

.invite{
  padding:8px 12px;

  border:0;

  background:#ffd02f;
  color:#172139;

  font-weight:900;
}

.invite:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.empty{
  padding:25px;

  text-align:center;

  color:#8494ad;
}

/* =========================================================
   INVITATIONS
========================================================= */

.invitation{
  padding:12px;

  margin-bottom:8px;

  background:#ffffff08;

  border:1px solid #ffffff15;
}

.invitation-name{
  font-size:19px;
  font-weight:900;
}

.invitation-actions{
  display:flex;
  gap:8px;

  margin-top:10px;
}

.accept,
.decline{
  flex:1;

  height:38px;

  border:0;

  font-weight:900;
}

.accept{
  background:#ffd02f;
  color:#172139;
}

.decline{
  background:#ffffff12;
  color:white;
}

/* =========================================================
   TOAST
========================================================= */

.toast{
  position:fixed;
  z-index:100;

  left:50%;
  bottom:35px;

  transform:
    translate(-50%,30px);

  opacity:0;
  pointer-events:none;

  padding:13px 20px;

  background:#07101eec;

  border:1px solid #ffffff25;

  box-shadow:0 10px 35px #0008;

  font-weight:800;

  transition:
    opacity .3s,
    transform .3s;
}

.toast.show{
  opacity:1;
  transform:
    translate(-50%,0);
}

/* =========================================================
   LOADING
========================================================= */

.loading{
  position:fixed;
  z-index:200;

  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#07101e;
}

.loading.hidden{
  display:none;
}

.loader-content{
  text-align:center;
}

.loader-logo{
  font-size:60px;

  font-weight:900;
  font-style:italic;

  text-shadow:4px 5px #000;
}

.loader-logo span{
  color:#ffd02f;
}

.loader-text{
  margin-top:10px;

  color:#8292aa;

  letter-spacing:3px;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:750px){

  .top{
    height:70px;
    padding:0 12px;
  }

  .logo{
    font-size:24px;
  }

  nav{
    display:none;
  }

  .vbucks{
    font-size:14px;
    padding:7px;
  }

  .avatar{
    width:37px;
    height:37px;
  }

  .center{
    inset:70px 0 0;
  }

  .eyebrow{
    font-size:16px;
  }

  .hero-title{
    font-size:65px;
  }

  .tagline{
    font-size:17px;
  }

  .play{
    font-size:23px;
    padding:13px 45px;
  }

  .bottom{
    left:12px;
    right:12px;
    bottom:12px;
  }

  .news{
    display:none;
  }

  .panel{
    top:78px;
    right:10px;

    width:
      calc(100vw - 20px);

    max-height:
      calc(100vh - 90px);
  }
}
</style>
</head>

<body>

<!-- =======================================================
     LOADING
======================================================= -->

<div id="loading" class="loading">

  <div class="loader-content">

    <div class="loader-logo">
      BATTLE<span>ZONE</span>
    </div>

    <div class="loader-text">
      LOADING PLAYER PROFILE...
    </div>

  </div>

</div>


<!-- =======================================================
     APP
======================================================= -->

<div class="app">

  <!-- TOP -->

  <header class="top">

    <div class="logo">
      BATTLE<span>ZONE</span>
    </div>

    <nav>

      <button class="active" data-page="play">
        PLAY
      </button>

      <button data-page="locker">
        LOCKER
      </button>

      <button data-page="shop">
        SHOP
      </button>

      <button data-page="battlepass">
        BATTLE PASS
      </button>

      <button data-page="quests">
        QUESTS
      </button>

    </nav>

    <div class="account">

      <div class="vbucks">
        <span class="coin">V</span>
        <span id="topVbucks">0</span>
      </div>

      <div id="topAvatar" class="avatar">
        ?
      </div>

    </div>

  </header>


  <!-- CENTER -->

  <main class="center">

    <section class="content">

      <div class="eyebrow">
        CHAPTER 2 • SEASON 9
      </div>

      <div class="hero-title">
        BATTLE<br>
        ROYAL
      </div>

      <div class="tagline">
        DROP IN. SURVIVE. CONQUER.
      </div>

      <button id="playButton" class="play">
        PLAY
      </button>

    </section>

  </main>


  <!-- BOTTOM -->

  <footer class="bottom">

    <div class="profile">

      <div id="bottomAvatar" class="pfp">
        ?
      </div>

      <div>

        <div id="playerName" class="name">
          LOADING...
        </div>

        <div id="playerLevel" class="level">
          LEVEL 1
        </div>

      </div>

    </div>


    <div class="news">

      <b>
        SEASON UPDATE
      </b>

      <small>
        New challenges are waiting.
      </small>

    </div>

  </footer>

</div>


<!-- =======================================================
     PLAYER PANEL
======================================================= -->

<section id="playersPanel" class="panel">

  <div class="panel-title">

    <h3>
      PLAYERS
    </h3>

    <button class="close" data-close="playersPanel">
      ×
    </button>

  </div>

  <div class="search">

    <input
      id="playerSearch"
      type="text"
      placeholder="Search username..."
      autocomplete="off"
    >

    <button id="searchButton">
      SEARCH
    </button>

  </div>

  <div id="playerList" class="player-list">

    <div class="empty">
      Loading PlayerDB...
    </div>

  </div>

</section>


<!-- =======================================================
     INVITATIONS PANEL
======================================================= -->

<section id="invitePanel" class="panel">

  <div class="panel-title">

    <h3>
      INVITATIONS
    </h3>

    <button class="close" data-close="invitePanel">
      ×
    </button>

  </div>

  <div id="invitationList">

    <div class="empty">
      Loading invitations...
    </div>

  </div>

</section>


<!-- =======================================================
     TOAST
======================================================= -->

<div id="toast" class="toast"></div>


<!-- =======================================================
     FIREBASE
======================================================= -->

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<!-- IMPORTANT:
     playerdb.js is a CLASSIC SCRIPT.
     Do NOT use type="module".
-->

<script src="./js/playerdb.js"></script>


<!-- =======================================================
     MAIN APPLICATION
======================================================= -->

<script>

"use strict";


/* =========================================================
   STATE
========================================================= */

let currentPlayer = null;
let allPlayers = [];


/* =========================================================
   ELEMENTS
========================================================= */

const loading =
  document.getElementById("loading");

const playerName =
  document.getElementById("playerName");

const playerLevel =
  document.getElementById("playerLevel");

const topVbucks =
  document.getElementById("topVbucks");

const topAvatar =
  document.getElementById("topAvatar");

const bottomAvatar =
  document.getElementById("bottomAvatar");

const playersPanel =
  document.getElementById("playersPanel");

const invitePanel =
  document.getElementById("invitePanel");

const playerList =
  document.getElementById("playerList");

const invitationList =
  document.getElementById("invitationList");

const playerSearch =
  document.getElementById("playerSearch");

const toast =
  document.getElementById("toast");


/* =========================================================
   TOAST
========================================================= */

let toastTimer;

function showToast(message){

  toast.textContent =
    message;

  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(
      () => toast.classList.remove("show"),
      2800
    );
}


/* =========================================================
   DISPLAY PLAYER
========================================================= */

function displayPlayer(player){

  if(!player){
    return;
  }

  currentPlayer =
    player;


  const username =
    player.username ||
    player.displayName ||
    "PLAYER";


  const level =
    Number(player.level || 1);


  const vbucks =
    Number(player.vbucks || 0);


  const letter =
    username
      .charAt(0)
      .toUpperCase();


  playerName.textContent =
    username;


  playerLevel.textContent =
    "LEVEL " + level;


  topVbucks.textContent =
    vbucks.toLocaleString();


  topAvatar.textContent =
    letter;


  bottomAvatar.textContent =
    letter;
}


/* =========================================================
   LOAD CURRENT PLAYER
========================================================= */

async function loadCurrentPlayer(){

  try{

    /*
      Wait for Firebase authentication.
    */

    const player =
      await new Promise(
        function(resolve,reject){

          let finished = false;

          const unsubscribe =
            PlayerDB.auth.onAuthStateChanged(
              async function(user){

                if(finished){
                  return;
                }

                finished = true;

                unsubscribe();

                if(!user){

                  reject(
                    new Error(
                      "You are not logged in."
                    )
                  );

                  return;
                }

                try{

                  const data =
                    await PlayerDB.getCurrentPlayer();

                  resolve(data);

                }catch(error){

                  reject(error);
                }

              }
            );

        }
      );


    if(!player){

      throw new Error(
        "Player profile not found."
      );
    }


    displayPlayer(player);


    /*
      Make sure URL username is synchronized
      with the actual Firebase PlayerDB username.
    */

    const expected =
      encodeURIComponent(
        player.username || ""
      );


    const currentUrl =
      new URL(
        window.location.href
      );


    if(
      player.username &&
      currentUrl.searchParams.get("user") !==
      player.username
    ){

      currentUrl.searchParams.set(
        "user",
        player.username
      );

      window.history.replaceState(
        {},
        "",
        currentUrl.toString()
      );
    }


    loading.classList.add("hidden");


    /*
      Load invitations after login.
    */

    loadInvitations();

  }catch(error){

    console.error(
      "[BattleZone]",
      error
    );


    loading.querySelector(".loader-text")
      .textContent =
      "LOGIN REQUIRED";


    setTimeout(
      function(){

        window.location.href =
          "./index.html";

      },
      1500
    );
  }
}


/* =========================================================
   LOAD PLAYERS
========================================================= */

async function loadPlayers(){

  playerList.innerHTML =
    '<div class="empty">Loading PlayerDB...</div>';


  try{

    allPlayers =
      await PlayerDB.getPlayers();


    renderPlayers(
      playerSearch.value
    );

  }catch(error){

    console.error(
      "[BattleZone] PlayerDB error:",
      error
    );


    playerList.innerHTML =
      '<div class="empty">Unable to load players.</div>';
  }
}


/* =========================================================
   RENDER PLAYERS
========================================================= */

function renderPlayers(search){

  search =
    String(search || "")
      .trim()
      .toLowerCase();


  const filtered =
    allPlayers.filter(
      function(player){

        if(
          !player ||
          !player.username
        ){
          return false;
        }


        /*
          Never show the current player
          in the invitation list.
        */

        if(
          currentPlayer &&
          player.uid === currentPlayer.uid
        ){
          return false;
        }


        if(!search){
          return true;
        }


        return player.username
          .toLowerCase()
          .includes(search);
      }
    );


  if(!filtered.length){

    playerList.innerHTML =
      '<div class="empty">No players found.</div>';

    return;
  }


  playerList.innerHTML = "";


  filtered.forEach(
    function(player){

      const row =
        document.createElement("div");

      row.className =
        "player";


      const avatar =
        document.createElement("div");

      avatar.className =
        "player-avatar";

      avatar.textContent =
        player.username
          .charAt(0)
          .toUpperCase();


      const info =
        document.createElement("div");

      info.className =
        "player-info";


      const name =
        document.createElement("div");

      name.className =
        "player-name";

      name.textContent =
        player.username;


      const level =
        document.createElement("div");

      level.className =
        "player-level";

      level.textContent =
        "LEVEL " +
        Number(player.level || 1);


      info.appendChild(name);
      info.appendChild(level);


      const button =
        document.createElement("button");

      button.className =
        "invite";

      button.textContent =
        "INVITE";


      /*
        This player came directly from
        Firestore PlayerDB, so it is a valid
        database player.
      */

      button.addEventListener(
        "click",
        function(){

          invitePlayer(
            player.username
          );

        }
      );


      row.appendChild(avatar);
      row.appendChild(info);
      row.appendChild(button);

      playerList.appendChild(row);

    }
  );
}


/* =========================================================
   INVITE PLAYER
========================================================= */

async function invitePlayer(username){

  if(!currentPlayer){

    showToast(
      "You are not logged in."
    );

    return;
  }


  try{

    /*
      Verify target AGAIN through Firebase.

      This prevents an invitation from being
      sent to a username that isn't in PlayerDB.
    */

    const target =
      await PlayerDB.getPlayer(
        username
      );


    if(!target){

      showToast(
        "Player is not in the database."
      );

      return;
    }


    if(
      target.uid ===
      currentPlayer.uid
    ){

      showToast(
        "You cannot invite yourself."
      );

      return;
    }


    await PlayerDB.sendInvitation(
      currentPlayer.username,
      target.username
    );


    showToast(
      "Invitation sent to " +
      target.username
    );

  }catch(error){

    console.error(
      "[BattleZone] Invitation error:",
      error
    );


    showToast(
      error.message ||
      "Unable to send invitation."
    );
  }
}


/* =========================================================
   LOAD INVITATIONS
========================================================= */

async function loadInvitations(){

  if(!currentPlayer){
    return;
  }


  try{

    const invitations =
      await PlayerDB.getInvitations();


    renderInvitations(
      invitations
    );

  }catch(error){

    console.error(
      "[BattleZone] Invitation load error:",
      error
    );


    invitationList.innerHTML =
      '<div class="empty">Unable to load invitations.</div>';
  }
}


/* =========================================================
   RENDER INVITATIONS
========================================================= */

function renderInvitations(
  invitations
){

  invitationList.innerHTML = "";


  if(
    !invitations ||
    !invitations.length
  ){

    invitationList.innerHTML =
      '<div class="empty">No pending invitations.</div>';

    return;
  }


  invitations.forEach(
    function(invitation){

      const box =
        document.createElement("div");

      box.className =
        "invitation";


      const name =
        document.createElement("div");

      name.className =
        "invitation-name";

      name.textContent =
        invitation.fromUsername ||
        "PLAYER";


      const text =
        document.createElement("div");

      text.style.color =
        "#8292aa";

      text.style.fontSize =
        "14px";

      text.textContent =
        "wants to play with you";


      const actions =
        document.createElement("div");

      actions.className =
        "invitation-actions";


      const accept =
        document.createElement("button");

      accept.className =
        "accept";

      accept.textContent =
        "ACCEPT";


      const decline =
        document.createElement("button");

      decline.className =
        "decline";

      decline.textContent =
        "DECLINE";


      accept.addEventListener(
        "click",
        async function(){

          try{

            await PlayerDB.acceptInvitation(
              invitation.id
            );

            showToast(
              "Invitation accepted."
            );

            loadInvitations();

          }catch(error){

            showToast(
              error.message ||
              "Unable to accept invitation."
            );

          }

        }
      );


      decline.addEventListener(
        "click",
        async function(){

          try{

            await PlayerDB.declineInvitation(
              invitation.id
            );

            showToast(
              "Invitation declined."
            );

            loadInvitations();

          }catch(error){

            showToast(
              error.message ||
              "Unable to decline invitation."
            );

          }

        }
      );


      actions.appendChild(
        accept
      );

      actions.appendChild(
        decline
      );


      box.appendChild(name);
      box.appendChild(text);
      box.appendChild(actions);


      invitationList.appendChild(box);

    }
  );
}


/* =========================================================
   OPEN PANEL
========================================================= */

function openPanel(panel){

  panel.classList.add("open");
}


/* =========================================================
   CLOSE PANELS
========================================================= */

function closePanels(){

  playersPanel.classList.remove("open");
  invitePanel.classList.remove("open");
}


/* =========================================================
   NAVIGATION
========================================================= */

document
  .querySelectorAll("nav button")
  .forEach(
    function(button){

      button.addEventListener(
        "click",
        function(){

          document
            .querySelectorAll("nav button")
            .forEach(
              function(item){
                item.classList.remove("active");
              }
            );


          button.classList.add(
            "active"
          );


          const page =
            button.dataset.page;


          if(page === "play"){

            closePanels();

            return;
          }


          if(page === "locker"){

            showToast(
              "Locker is coming soon."
            );

            return;
          }


          if(page === "shop"){

            showToast(
              "Shop is coming soon."
            );

            return;
          }


          if(page === "battlepass"){

            showToast(
              "Battle Pass is coming soon."
            );

            return;
          }


          if(page === "quests"){

            showToast(
              "Quests are coming soon."
            );

          }

        }
      );

    }
  );


/* =========================================================
   AVATAR CLICK
========================================================= */

topAvatar.addEventListener(
  "click",
  function(){

    if(
      playersPanel.classList.contains("open")
    ){

      closePanels();

    }else{

      openPanel(
        playersPanel
      );

      loadPlayers();

    }

  }
);


/* =========================================================
   PROFILE CLICK
========================================================= */

bottomAvatar.addEventListener(
  "click",
  function(){

    openPanel(
      invitePanel
    );

    loadInvitations();

  }
);


/* =========================================================
   SEARCH
========================================================= */

playerSearch.addEventListener(
  "input",
  function(){

    renderPlayers(
      playerSearch.value
    );

  }
);


document
  .getElementById("searchButton")
  .addEventListener(
    "click",
    function(){

      renderPlayers(
        playerSearch.value
      );

    }
  );


/* =========================================================
   CLOSE BUTTONS
========================================================= */

document
  .querySelectorAll("[data-close]")
  .forEach(
    function(button){

      button.addEventListener(
        "click",
        closePanels
      );

    }
  );


/* =========================================================
   PLAY
========================================================= */

document
  .getElementById("playButton")
  .addEventListener(
    "click",
    function(){

      const button =
        this;


      button.disabled =
        true;

      button.textContent =
        "MATCHMAKING...";


      setTimeout(
        function(){

          button.disabled =
            false;

          button.textContent =
            "PLAY";

          showToast(
            "No matchmaking server connected yet."
          );

        },
        1600
      );

    }
  );


/* =========================================================
   ESC
========================================================= */

document.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Escape"){

      closePanels();

    }

  }
);


/* =========================================================
   START
========================================================= */

if(
  window.PlayerDB
){

  loadCurrentPlayer();

}else{

  console.error(
    "[BattleZone] PlayerDB was not loaded."
  );

  loading.querySelector(".loader-text")
    .textContent =
    "PLAYER DATABASE ERROR";

}

</script>
