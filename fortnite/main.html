<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07101e">
<title>BattleZone</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&display=swap');

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:'Barlow Condensed',Arial,sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at 70% 35%,#d99b7080,transparent 25%),
    linear-gradient(135deg,#182d54,#416d9a 48%,#d68b58);
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

#app{
  width:100%;
  height:100%;
  position:relative;
}

#app:before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      180deg,
      #0008,
      transparent 35%,
      #0008
    );
  pointer-events:none;
}

/* HEADER */

header{
  position:relative;
  z-index:5;
  height:82px;
  display:flex;
  align-items:center;
  padding:0 28px;
  background:linear-gradient(#07101eee,transparent);
}

.logo{
  font-size:31px;
  font-weight:900;
  font-style:italic;
  text-shadow:3px 4px #111;
}

.logo span{
  color:#ffd02f;
}

nav{
  display:flex;
  margin-left:45px;
  gap:5px;
}

nav button{
  height:48px;
  padding:0 20px;
  border:0;
  background:transparent;
  color:#fff;
  font-weight:900;
  font-size:18px;
}

nav button:hover,
nav button.active{
  background:#ffffff1c;
}

nav button.active{
  border-bottom:4px solid #ffd42e;
}

.account{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:12px;
}

.vbucks{
  background:#07101dcc;
  border:1px solid #ffffff35;
  padding:9px 14px;
  border-radius:5px;
  font-weight:800;
}

.coin{
  display:inline-grid;
  place-items:center;
  width:20px;
  height:20px;
  border-radius:50%;
  background:#62d8ff;
  color:#16466d;
  margin-right:5px;
}

.avatar{
  width:43px;
  height:43px;
  display:grid;
  place-items:center;
  font-weight:900;
  background:linear-gradient(135deg,#202b4a,#d79769);
  border:2px solid white;
}

/* MAIN */

.center{
  position:absolute;
  inset:82px 0 0;
  display:grid;
  place-items:center;
  text-align:center;
  z-index:2;
}

.content{
  margin-top:-20px;
}

.eyebrow{
  font-size:22px;
  letter-spacing:4px;
  font-weight:800;
}

.hero-title{
  font-size:clamp(70px,11vw,155px);
  line-height:.8;
  margin:13px 0;
  font-weight:900;
  font-style:italic;
  text-shadow:
    6px 7px #202b43,
    12px 15px 25px #0008;
}

.tagline{
  font-size:23px;
  font-weight:800;
  letter-spacing:2px;
}

.play{
  margin-top:30px;
  padding:16px 65px;
  background:#f5c82e;
  color:#172139;
  border:3px solid white;
  font-size:29px;
  font-weight:900;
  letter-spacing:2px;
  clip-path:polygon(3% 0,100% 0,97% 100%,0 100%);
}

.play:hover{
  filter:brightness(1.1);
  transform:translateY(-2px);
}

/* PROFILE */

.bottom{
  position:absolute;
  z-index:5;
  left:24px;
  right:24px;
  bottom:20px;
  display:flex;
  justify-content:space-between;
  align-items:end;
}

.profile{
  display:flex;
  gap:12px;
  align-items:center;
  background:#07101dcc;
  padding:10px 15px;
  border:1px solid #ffffff30;
}

.pfp{
  width:48px;
  height:48px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#273557,#d99a71);
  font-size:20px;
  font-weight:900;
}

.name{
  font-size:21px;
  font-weight:900;
}

.level{
  font-size:15px;
  opacity:.7;
}

/* FRIENDS */

.friends-button{
  position:absolute;
  right:24px;
  top:100px;
  z-index:10;
  padding:12px 20px;
  border:1px solid #ffffff40;
  background:#07101ddd;
  color:white;
  font-weight:900;
}

.panel{
  position:fixed;
  z-index:30;
  top:82px;
  right:0;
  width:min(430px,100%);
  height:calc(100% - 82px);
  padding:22px;
  background:#07101ef5;
  border-left:1px solid #ffffff25;
  backdrop-filter:blur(18px);
  transform:translateX(100%);
  transition:.3s ease;
  overflow:auto;
}

.panel.open{
  transform:translateX(0);
}

.panel-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
}

.panel-header h2{
  margin:0;
  font-size:30px;
  font-style:italic;
}

.close{
  width:38px;
  height:38px;
  border:1px solid #ffffff30;
  background:#ffffff10;
  color:white;
  font-size:20px;
}

/* INVITE */

.invite-box{
  padding:16px;
  background:#ffffff08;
  border:1px solid #ffffff18;
  margin-bottom:15px;
}

.invite-box label{
  display:block;
  margin-bottom:8px;
  font-weight:800;
  color:#aebdd2;
}

.invite-row{
  display:flex;
  gap:8px;
}

.invite-row input{
  flex:1;
  min-width:0;
  height:48px;
  padding:0 12px;
  border:1px solid #ffffff20;
  background:#101c31;
  color:white;
  outline:none;
}

.invite-row input:focus{
  border-color:#ffd02f;
}

.invite-row button{
  width:90px;
  border:0;
  background:#f5c82e;
  color:#172139;
  font-weight:900;
}

.invite-status{
  min-height:22px;
  margin-top:10px;
  font-size:14px;
  color:#9fb1cb;
}

.invite-status.error{
  color:#ff7777;
}

.invite-status.success{
  color:#72e3a1;
}

/* ONLINE */

.section-title{
  margin:22px 0 10px;
  color:#91a5c2;
  font-size:13px;
  letter-spacing:2px;
  font-weight:900;
}

.player{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  margin-bottom:7px;
  background:#ffffff08;
  border:1px solid #ffffff12;
}

.player-avatar{
  width:40px;
  height:40px;
  display:grid;
  place-items:center;
  background:#263653;
  font-weight:900;
}

.player-info{
  flex:1;
  min-width:0;
}

.player-name{
  font-size:18px;
  font-weight:900;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.player-status{
  color:#6ee29d;
  font-size:13px;
}

.invite-small{
  padding:8px 12px;
  background:#f5c82e;
  color:#172139;
  border:0;
  font-weight:900;
}

.empty{
  padding:25px 10px;
  text-align:center;
  color:#71829c;
}

/* TOAST */

.toast{
  position:fixed;
  z-index:100;
  left:50%;
  bottom:35px;
  transform:translate(-50%,20px);
  padding:13px 22px;
  background:#07101eee;
  border:1px solid #ffffff30;
  box-shadow:0 10px 40px #0008;
  opacity:0;
  pointer-events:none;
  transition:.3s;
  font-weight:800;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* MOBILE */

@media(max-width:750px){

  header{
    padding:0 14px;
  }

  nav{
    display:none;
  }

  .logo{
    font-size:24px;
  }

  .eyebrow{
    font-size:16px;
  }

  .tagline{
    font-size:17px;
  }

  .hero-title{
    font-size:65px;
  }

  .play{
    font-size:23px;
    padding:13px 45px;
  }

  .bottom{
    left:12px;
    right:12px;
  }

  .friends-button{
    right:12px;
    top:92px;
  }

  .vbucks{
    font-size:14px;
    padding:7px;
  }

  .avatar{
    width:37px;
    height:37px;
  }

  .panel{
    top:70px;
    height:calc(100% - 70px);
  }
}
</style>
</head>

<body>

<div id="app">

<header>

  <div class="logo">
    BATTLE<span>ZONE</span>
  </div>

  <nav>
    <button class="active">PLAY</button>
    <button>LOCKER</button>
    <button>SHOP</button>
    <button>BATTLE PASS</button>
    <button>QUESTS</button>
  </nav>

  <div class="account">

    <div class="vbucks">
      <span class="coin">V</span>
      2,850
    </div>

    <div id="headerAvatar" class="avatar">
      ?
    </div>

  </div>

</header>

<button id="friendsButton" class="friends-button">
  FRIENDS
</button>

<main class="center">

  <section class="content">

    <div class="eyebrow">
      CHAPTER 2 • SEASON 9
    </div>

    <div class="hero-title">
      BATTLE<br>ROYAL
    </div>

    <div class="tagline">
      DROP IN. SURVIVE. CONQUER.
    </div>

    <button id="playButton" class="play">
      PLAY
    </button>

  </section>

</main>

<footer class="bottom">

  <div class="profile">

    <div id="profileAvatar" class="pfp">
      ?
    </div>

    <div>

      <div id="profileName" class="name">
        LOADING...
      </div>

      <div class="level">
        LEVEL 1
      </div>

    </div>

  </div>

</footer>

</div>


<!-- FRIENDS / INVITATION PANEL -->

<aside id="friendsPanel" class="panel">

  <div class="panel-header">

    <h2>FRIENDS</h2>

    <button id="closeFriends" class="close">
      ×
    </button>

  </div>


  <div class="invite-box">

    <label>
      INVITE PLAYER
    </label>

    <div class="invite-row">

      <input
        id="inviteUsername"
        type="text"
        placeholder="Enter username"
        autocomplete="off"
      >

      <button id="inviteButton">
        INVITE
      </button>

    </div>

    <div
      id="inviteStatus"
      class="invite-status"
    ></div>

  </div>


  <div class="section-title">
    DATABASE PLAYERS
  </div>

  <div id="playersList">

    <div class="empty">
      Loading players...
    </div>

  </div>

</aside>


<div id="toast" class="toast"></div>


<script type="module">

/*
=========================================================
  BATTLEZONE MAIN
=========================================================

  URL expected:

  main.html?user=YourUsername

  Example:

  main.html?user=Krv

  The username is decoded from the URL and displayed.

  Authentication/database functions are loaded from:

  ./js/playerdb.js
=========================================================
*/

import * as PlayerDBModule from "./js/playerdb.js";

const PlayerDB =
  PlayerDBModule.default || PlayerDBModule;


/* =======================================================
   DOM
======================================================= */

const profileName =
  document.getElementById("profileName");

const profileAvatar =
  document.getElementById("profileAvatar");

const headerAvatar =
  document.getElementById("headerAvatar");

const friendsButton =
  document.getElementById("friendsButton");

const friendsPanel =
  document.getElementById("friendsPanel");

const closeFriends =
  document.getElementById("closeFriends");

const inviteUsername =
  document.getElementById("inviteUsername");

const inviteButton =
  document.getElementById("inviteButton");

const inviteStatus =
  document.getElementById("inviteStatus");

const playersList =
  document.getElementById("playersList");

const toast =
  document.getElementById("toast");


/* =======================================================
   GET USERNAME FROM URL
======================================================= */

function getUsernameFromURL(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  const user =
    params.get("user");

  if(!user){
    return null;
  }

  return user.trim();
}


/* =======================================================
   CURRENT USER
======================================================= */

let currentUsername =
  getUsernameFromURL();


/*
  IMPORTANT:

  Do NOT immediately use "PLAYER".

  If main.html was opened without ?user=,
  redirect back to the login page.
*/

if(!currentUsername){

  const saved =
    localStorage.getItem("battlezone-user");

  if(saved){

    currentUsername =
      saved.trim();

  }else{

    window.location.replace(
      "./index.html"
    );

  }

}


/* =======================================================
   DISPLAY USERNAME
======================================================= */

function updateUserUI(username){

  if(!username){
    return;
  }

  const visibleName =
    username;

  profileName.textContent =
    visibleName;

  const firstLetter =
    visibleName
      .charAt(0)
      .toUpperCase();

  profileAvatar.textContent =
    firstLetter;

  headerAvatar.textContent =
    firstLetter;

  document.title =
    "BattleZone • " + visibleName;
}


/* =======================================================
   PLAYER DATABASE HELPERS
======================================================= */

/*
  Different versions of playerdb.js may export
  different function names.

  These helpers support common names.
*/


async function findPlayer(username){

  if(typeof PlayerDB.getPlayer === "function"){
    return await PlayerDB.getPlayer(username);
  }

  if(typeof PlayerDB.findPlayer === "function"){
    return await PlayerDB.findPlayer(username);
  }

  if(typeof PlayerDB.getPlayerByUsername === "function"){
    return await PlayerDB.getPlayerByUsername(username);
  }

  if(typeof PlayerDB.findUser === "function"){
    return await PlayerDB.findUser(username);
  }

  return null;
}


async function getPlayers(){

  if(typeof PlayerDB.getPlayers === "function"){
    return await PlayerDB.getPlayers();
  }

  if(typeof PlayerDB.getAllPlayers === "function"){
    return await PlayerDB.getAllPlayers();
  }

  if(typeof PlayerDB.listPlayers === "function"){
    return await PlayerDB.listPlayers();
  }

  return [];
}


/* =======================================================
   VERIFY CURRENT PLAYER
======================================================= */

async function verifyCurrentPlayer(){

  try{

    const player =
      await findPlayer(currentUsername);

    /*
      If playerdb.js provides a lookup function,
      make sure the account actually exists.
    */

    if(player === null ||
       player === undefined){

      /*
        Do not destroy the URL username just because
        this particular playerdb implementation doesn't
        expose lookup.
      */

      if(
        typeof PlayerDB.getPlayer === "function" ||
        typeof PlayerDB.findPlayer === "function" ||
        typeof PlayerDB.getPlayerByUsername === "function" ||
        typeof PlayerDB.findUser === "function"
      ){

        throw new Error(
          "PLAYER_NOT_FOUND"
        );
      }

    }

    updateUserUI(currentUsername);

    return true;

  }catch(error){

    console.error(
      "Player verification failed:",
      error
    );

    profileName.textContent =
      "LOGIN REQUIRED";

    setTimeout(() => {

      window.location.replace(
        "./index.html"
      );

    },1200);

    return false;
  }
}


/* =======================================================
   LOAD DATABASE PLAYERS
======================================================= */

async function loadPlayers(){

  playersList.innerHTML =
    '<div class="empty">Loading players...</div>';

  try{

    const players =
      await getPlayers();

    if(!Array.isArray(players) ||
       players.length === 0){

      playersList.innerHTML =
        '<div class="empty">No players available.</div>';

      return;
    }


    /*
      Only database players are rendered.
    */

    const validPlayers =
      players
        .map(player => {

          if(typeof player === "string"){
            return {
              username:player
            };
          }

          return player;

        })
        .filter(player =>
          player &&
          typeof player.username === "string" &&
          player.username.trim()
        )
        .filter(player =>
          player.username.toLowerCase() !==
          currentUsername.toLowerCase()
        );


    if(validPlayers.length === 0){

      playersList.innerHTML =
        '<div class="empty">No other database players.</div>';

      return;
    }


    playersList.innerHTML = "";


    validPlayers.forEach(player => {

      const username =
        player.username.trim();

      const row =
        document.createElement("div");

      row.className =
        "player";


      const avatar =
        document.createElement("div");

      avatar.className =
        "player-avatar";

      avatar.textContent =
        username.charAt(0).toUpperCase();


      const info =
        document.createElement("div");

      info.className =
        "player-info";


      const name =
        document.createElement("div");

      name.className =
        "player-name";

      name.textContent =
        username;


      const status =
        document.createElement("div");

      status.className =
        "player-status";

      status.textContent =
        "DATABASE PLAYER";


      const invite =
        document.createElement("button");

      invite.className =
        "invite-small";

      invite.textContent =
        "INVITE";


      invite.onclick = () => {

        invitePlayer(username);

      };


      info.appendChild(name);
      info.appendChild(status);

      row.appendChild(avatar);
      row.appendChild(info);
      row.appendChild(invite);

      playersList.appendChild(row);

    });

  }catch(error){

    console.error(
      "Could not load players:",
      error
    );

    playersList.innerHTML =
      '<div class="empty">Unable to load player database.</div>';
  }
}


/* =======================================================
   INVITE PLAYER
======================================================= */

async function invitePlayer(username){

  inviteStatus.textContent = "";
  inviteStatus.className =
    "invite-status";

  username =
    String(username || "").trim();


  if(!username){

    showInviteError(
      "Enter a username."
    );

    return;
  }


  if(
    username.toLowerCase() ===
    currentUsername.toLowerCase()
  ){

    showInviteError(
      "You cannot invite yourself."
    );

    return;
  }


  inviteButton.disabled = true;
  inviteButton.textContent = "...";


  try{

    /*
      FIRST:
      Verify the target player exists in Firebase.
    */

    const target =
      await findPlayer(username);


    /*
      If playerdb.js supports lookup and returns
      nothing, the target is NOT allowed.
    */

    if(
      target === null ||
      target === undefined
    ){

      if(
        typeof PlayerDB.getPlayer === "function" ||
        typeof PlayerDB.findPlayer === "function" ||
        typeof PlayerDB.getPlayerByUsername === "function" ||
        typeof PlayerDB.findUser === "function"
      ){

        throw new Error(
          "PLAYER_NOT_FOUND"
        );
      }
    }


    /*
      SECOND:
      Send invitation through playerdb.js.
    */

    if(typeof PlayerDB.sendInvitation === "function"){

      await PlayerDB.sendInvitation(
        currentUsername,
        username
      );

    }else if(typeof PlayerDB.sendInvite === "function"){

      await PlayerDB.sendInvite(
        currentUsername,
        username
      );

    }else if(typeof PlayerDB.invitePlayer === "function"){

      await PlayerDB.invitePlayer(
        currentUsername,
        username
      );

    }else{

      /*
        If there is no invitation function, don't pretend
        that a Firebase invitation was created.
      */

      throw new Error(
        "INVITE_FUNCTION_MISSING"
      );
    }


    inviteStatus.className =
      "invite-status success";

    inviteStatus.textContent =
      "Invitation sent to " + username;

    showToast(
      "Invitation sent to " + username
    );


  }catch(error){

    console.error(
      "Invitation failed:",
      error
    );

    if(error.message === "PLAYER_NOT_FOUND"){

      showInviteError(
        "That player is not in the database."
      );

    }else if(
      error.message ===
      "INVITE_FUNCTION_MISSING"
    ){

      showInviteError(
        "playerdb.js has no invitation function."
      );

    }else{

      showInviteError(
        error.message ||
        "Could not send invitation."
      );

    }

  }finally{

    inviteButton.disabled = false;
    inviteButton.textContent = "INVITE";

  }
}


/* =======================================================
   INVITE FORM
======================================================= */

inviteButton.addEventListener(
  "click",
  () => {

    invitePlayer(
      inviteUsername.value
    );

  }
);


inviteUsername.addEventListener(
  "keydown",
  event => {

    if(event.key === "Enter"){

      event.preventDefault();

      invitePlayer(
        inviteUsername.value
      );

    }

  }
);


/* =======================================================
   INVITE STATUS
======================================================= */

function showInviteError(message){

  inviteStatus.className =
    "invite-status error";

  inviteStatus.textContent =
    message;
}


/* =======================================================
   FRIENDS PANEL
======================================================= */

friendsButton.addEventListener(
  "click",
  async () => {

    friendsPanel.classList.add("open");

    await loadPlayers();

  }
);


closeFriends.addEventListener(
  "click",
  () => {

    friendsPanel.classList.remove("open");

  }
);


/* =======================================================
   TOAST
======================================================= */

let toastTimer;

function showToast(message){

  toast.textContent =
    message;

  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(() => {

      toast.classList.remove("show");

    },3000);
}


/* =======================================================
   PLAY
======================================================= */

document
  .getElementById("playButton")
  .addEventListener(
    "click",
    event => {

      const button =
        event.currentTarget;

      button.textContent =
        "MATCHMAKING...";

      setTimeout(() => {

        button.textContent =
          "PLAY";

      },1600);

    }
  );


/* =======================================================
   NAV
======================================================= */

document
  .querySelectorAll("nav button")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        document
          .querySelectorAll("nav button")
          .forEach(item =>
            item.classList.remove("active")
          );

        button.classList.add("active");

      }
    );

  });


/* =======================================================
   START
======================================================= */

(async function(){

  if(!currentUsername){
    return;
  }

  /*
    Immediately show the URL username.
    This prevents the old "PLAYER" fallback.
  */

  updateUserUI(
    currentUsername
  );


  const valid =
    await verifyCurrentPlayer();

  if(!valid){
    return;
  }

})();

</script>

</body>
</html>
