
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>SkyForge Multiplayer</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050912;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

canvas{
  display:block;
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
  color:#fff;
}

#menu{
  position:fixed;
  z-index:20;
  width:min(500px,calc(100vw - 24px));
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  padding:28px;
  border-radius:22px;
  background:rgba(5,11,24,.94);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 30px 100px rgba(0,0,0,.55);
}

.logo{
  font-size:36px;
  font-weight:900;
  letter-spacing:-2px;
}

.logo span{
  color:#43b9ff;
}

.sub{
  color:#8796ad;
  font-size:13px;
  margin-top:5px;
  margin-bottom:22px;
}

label{
  display:block;
  color:#7f8da4;
  font-size:11px;
  font-weight:800;
  margin:12px 0 6px;
}

input{
  width:100%;
  height:46px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.055);
  border-radius:12px;
  outline:none;
  color:#fff;
  padding:0 13px;
}

input:focus{
  border-color:#43b9ff;
}

.btn{
  width:100%;
  height:48px;
  border:0;
  border-radius:12px;
  margin-top:10px;
  font-weight:900;
}

.primary{
  background:linear-gradient(135deg,#078cff,#6c4dff);
}

.secondary{
  background:rgba(255,255,255,.08);
}

.smallRow{
  display:flex;
  gap:8px;
}

.smallRow input{
  flex:1;
}

.smallRow button{
  width:100px;
  border:0;
  border-radius:12px;
  background:#1b2c46;
  font-weight:800;
}

#joinBox{
  display:none;
  margin-top:16px;
  padding-top:16px;
  border-top:1px solid rgba(255,255,255,.08);
}

#roomBox{
  display:none;
  margin-top:16px;
  padding:14px;
  border-radius:14px;
  background:rgba(60,180,255,.07);
  border:1px solid rgba(60,180,255,.15);
}

.roomTitle{
  color:#69c8ff;
  font-size:11px;
  font-weight:900;
  margin-bottom:7px;
}

#roomId{
  font-size:15px;
  font-weight:900;
  letter-spacing:.5px;
}

#inviteLink{
  margin-top:8px;
  color:#8999b1;
  font-size:10px;
  word-break:break-all;
  line-height:1.5;
}

#status{
  min-height:20px;
  margin-top:14px;
  color:#9aaac1;
  font-size:12px;
}

#menu{
  transition:all .25s ease;
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

#menu .btn{
  cursor:pointer;
  color:#fff;
  transition:transform .16s ease, filter .16s ease, box-shadow .16s ease;
}

#menu .btn:hover{
  transform:translateY(-1px);
  filter:brightness(1.12);
  box-shadow:0 8px 24px rgba(0,0,0,.22);
}

#menu .btn:active{
  transform:translateY(1px) scale(.99);
}

#menu.playing{
  left:18px;
  top:18px;
  transform:none;
  width:min(350px,calc(100vw - 36px));
  padding:16px;
  border-radius:18px;
  z-index:40;
}

#menu.playing .logo{font-size:24px;letter-spacing:-1px}
#menu.playing .sub,
#menu.playing > label,
#menu.playing > #name,
#menu.playing > #create,
#menu.playing > #showJoin,
#menu.playing > #joinBox{display:none!important}
#menu.playing #roomBox{display:block!important;margin-top:0}
#menu.playing #status{margin-top:9px}

.roomActions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:9px;
}

.roomActions button{
  height:40px;
  border:0;
  border-radius:10px;
  color:#fff;
  background:rgba(255,255,255,.09);
  font-weight:900;
  cursor:pointer;
}

.roomActions button:hover{background:rgba(255,255,255,.15)}

#closeRoomPanel{
  width:100%;
  margin-top:8px;
  height:36px;
  border:0;
  border-radius:10px;
  color:#9fb0c7;
  background:rgba(255,255,255,.05);
  font-weight:800;
}

@media(max-width:700px){
  #menu.playing{
    left:10px;top:10px;
    width:min(310px,calc(100vw - 20px));
    padding:13px;
  }
}

#game{
  display:none;
  position:fixed;
  inset:0;
  z-index:5;
  pointer-events:none;
}

#game > *{
  pointer-events:auto;
}

#top{
  position:absolute;
  top:12px;
  left:12px;
  right:12px;
  display:flex;
  justify-content:space-between;
  pointer-events:none;
}

.hud{
  padding:10px 14px;
  border-radius:13px;
  background:rgba(5,10,20,.65);
  border:1px solid rgba(255,255,255,.1);
  backdrop-filter:blur(10px);
}

#players{
  color:#9eb0c9;
  font-size:12px;
  margin-top:3px;
}

#ping{
  color:#63d1ff;
  font-size:12px;
}

#crosshair{
  position:absolute;
  left:50%;
  top:50%;
  width:18px;
  height:18px;
  transform:translate(-50%,-50%);
  opacity:.65;
  pointer-events:none;
}

#crosshair:before,
#crosshair:after{
  content:"";
  position:absolute;
  background:white;
}

#crosshair:before{
  width:2px;
  height:18px;
  left:8px;
}

#crosshair:after{
  width:18px;
  height:2px;
  top:8px;
}

#chat{
  position:absolute;
  left:12px;
  bottom:12px;
  width:min(350px,calc(100vw - 24px));
}

#messages{
  max-height:180px;
  overflow:auto;
}

.msg{
  display:block;
  width:max-content;
  max-width:100%;
  padding:7px 10px;
  margin:4px 0;
  border-radius:10px;
  background:rgba(5,10,20,.7);
  font-size:12px;
}

.msg b{
  color:#55c4ff;
}

#chatForm{
  display:flex;
  gap:6px;
  margin-top:7px;
}

#chatInput{
  height:40px;
}

#chatSend{
  width:55px;
  border:0;
  border-radius:10px;
  background:#078cff;
  font-weight:900;
}

#leave{
  position:absolute;
  right:12px;
  bottom:12px;
  width:75px;
  height:40px;
  border:0;
  border-radius:10px;
  background:#a72d3b;
  font-size:11px;
  font-weight:900;
}

/* MOBILE */

#mobile{
  display:none;
  position:absolute;
  inset:0;
  pointer-events:none;
}

#lookArea{
  position:absolute;
  right:0;
  top:0;
  width:58%;
  height:72%;
  pointer-events:auto;
  touch-action:none;
}

#joystick{
  position:absolute;
  left:22px;
  bottom:28px;
  width:130px;
  height:130px;
  border-radius:50%;
  background:rgba(255,255,255,.08);
  border:2px solid rgba(255,255,255,.12);
  pointer-events:auto;
  touch-action:none;
}

#stick{
  position:absolute;
  left:50%;
  top:50%;
  width:56px;
  height:56px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:rgba(67,185,255,.78);
}

.action{
  position:absolute;
  border:1px solid rgba(255,255,255,.15);
  border-radius:50%;
  background:rgba(8,18,35,.8);
  font-size:11px;
  font-weight:900;
  pointer-events:auto;
  touch-action:none;
}

#jump{
  right:24px;
  bottom:42px;
  width:72px;
  height:72px;
}

#run{
  right:108px;
  bottom:30px;
  width:58px;
  height:58px;
}

@media(max-width:700px){
  #mobile{
    display:block;
  }

  #chat{
    width:250px;
    bottom:175px;
  }

  #messages{
    max-height:100px;
  }

  #ping{
    display:none;
  }

  #menu{
    padding:22px;
  }

  .logo{
    font-size:30px;
  }
}

@media(pointer:fine){
  #mobile{
    display:none!important;
  }
}
</style>
</head>

<body>

<div id="menu">

  <div class="logo">
    SKY<span>FORGE</span>
  </div>

  <div class="sub">
    Public WebRTC multiplayer platform
  </div>

  <label>PLAYER NAME</label>
  <input id="name" maxlength="18" placeholder="Enter your name">

  <button id="create" class="btn primary">
    CREATE ROOM
  </button>

  <button id="showJoin" class="btn secondary">
    JOIN ROOM
  </button>

  <div id="roomBox">

    <div class="roomTitle">
      YOUR ROOM ID
    </div>

    <div class="smallRow">
      <input id="roomId" readonly>
      <button id="copyId">
        COPY
      </button>
    </div>

    <div class="roomTitle" style="margin-top:14px">
      INVITE LINK
    </div>

    <div id="inviteLink"></div>

    <button id="copyLink" class="btn secondary">
      COPY INVITE LINK
    </button>

    <div class="roomActions">
      <button id="shareRoom">SHARE ROOM</button>
      <button id="newRoom">NEW ROOM</button>
    </div>
    <button id="closeRoomPanel">HIDE ROOM PANEL</button>

  </div>

  <div id="joinBox">

    <label>ROOM ID OR INVITE LINK</label>

    <input
      id="joinInput"
      placeholder="Paste Room ID or invite link">

    <button id="join" class="btn primary">
      JOIN ROOM
    </button>

  </div>

  <div id="status">
    Ready.
  </div>

</div>


<div id="game">

  <div id="top">

    <div class="hud">
      <b>SKYFORGE</b>
      <div id="players">
        Players: 1
      </div>
    </div>

    <div id="ping" class="hud">
      P2P
    </div>

  </div>

  <div id="crosshair"></div>

  <div id="chat">

    <div id="messages"></div>

    <form id="chatForm">
      <input id="chatInput" maxlength="100" placeholder="Chat...">
      <button id="chatSend">→</button>
    </form>

  </div>

  <button id="leave">
    LEAVE
  </button>

  <div id="mobile">

    <div id="lookArea"></div>

    <div id="joystick">
      <div id="stick"></div>
    </div>

    <button id="jump" class="action">
      JUMP
    </button>

    <button id="run" class="action">
      RUN
    </button>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


/* =========================================================
   SETTINGS
========================================================= */

const WORLD = 220;

const WALK = 6;

const RUN = 10;

const GRAVITY = 22;

const JUMP = 8;

const NET_RATE = 30;


/* =========================================================
   UI
========================================================= */

const menu =
document.getElementById("menu");

const game =
document.getElementById("game");

const nameInput =
document.getElementById("name");

const createBtn =
document.getElementById("create");

const showJoin =
document.getElementById("showJoin");

const joinBox =
document.getElementById("joinBox");

const joinInput =
document.getElementById("joinInput");

const joinBtn =
document.getElementById("join");

const roomBox =
document.getElementById("roomBox");

const roomIdInput =
document.getElementById("roomId");

const inviteLink =
document.getElementById("inviteLink");

const copyId =
document.getElementById("copyId");

const copyLink =
document.getElementById("copyLink");

const status =
document.getElementById("status");

const playersText =
document.getElementById("players");

const pingText =
document.getElementById("ping");

const messages =
document.getElementById("messages");

const chatForm =
document.getElementById("chatForm");

const chatInput =
document.getElementById("chatInput");

const leave =
document.getElementById("leave");


/* =========================================================
   NETWORK STATE
========================================================= */

let peer = null;

let myId = "";

let hostId = "";

let isHost = false;

let started = false;

const connections = new Map();

const remotePlayers = new Map();

let lastSend = 0;

let lastPing = 0;


/* =========================================================
   THREE
========================================================= */

let scene;

let camera;

let renderer;

let clock;

let localMesh;

let nameSprite;

let world;


/* =========================================================
   PLAYER STATE
========================================================= */

const me = {

  name:"",

  pos:new THREE.Vector3(0,0.02,0),

  vel:new THREE.Vector3(0,0,0),

  yaw:0,

  pitch:0,

  grounded:false,

  running:false

};


/* =========================================================
   INPUT
========================================================= */

const keys = {};

let joyX = 0;

let joyY = 0;

let joyActive = false;

let lookActive = false;

let lookX = 0;

let lookY = 0;


/* =========================================================
   THREE INIT
========================================================= */

function initThree(){

  scene =
  new THREE.Scene();

  scene.background =
  new THREE.Color(0x071426);

  scene.fog =
  new THREE.FogExp2(
    0x071426,
    .006
  );


  camera =
  new THREE.PerspectiveCamera(
    75,
    innerWidth/innerHeight,
    .05,
    700
  );


  renderer =
  new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
  });


  renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
  );

  renderer.setSize(
    innerWidth,
    innerHeight
  );

  renderer.shadowMap.enabled = true;

  document.body.appendChild(
    renderer.domElement
  );


  clock =
  new THREE.Clock();


  const hemi =
  new THREE.HemisphereLight(
    0xaad8ff,
    0x172235,
    1.7
  );

  scene.add(hemi);


  const sun =
  new THREE.DirectionalLight(
    0xffffff,
    3
  );

  sun.position.set(
    60,
    100,
    50
  );

  sun.castShadow = true;

  sun.shadow.mapSize.set(
    2048,
    2048
  );

  scene.add(sun);


  world =
  new THREE.Group();

  scene.add(world);


  createWorld();

  createLocalPlayer();


  addEventListener(
    "resize",
    resize
  );


  animate();

}


/* =========================================================
   WORLD
========================================================= */

function createWorld(){

  const ground =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      WORLD,
      2,
      WORLD
    ),
    new THREE.MeshStandardMaterial({
      color:0x172a40,
      roughness:.8
    })
  );

  ground.position.y = -1;

  ground.receiveShadow = true;

  world.add(ground);


  const grid =
  new THREE.GridHelper(
    WORLD,
    55,
    0x4d789d,
    0x29435e
  );

  grid.position.y = .02;

  grid.material.transparent = true;

  grid.material.opacity = .35;

  world.add(grid);


  const material =
  new THREE.MeshStandardMaterial({
    color:0x294761,
    roughness:.65
  });


  for(let i=0;i<80;i++){

    const x =
    (Math.random()-.5)*(WORLD-10);

    const z =
    (Math.random()-.5)*(WORLD-10);

    const w =
    2+Math.random()*6;

    const h =
    1+Math.random()*8;

    const d =
    2+Math.random()*6;


    const block =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w,h,d
      ),
      material
    );

    block.position.set(
      x,
      h/2,
      z
    );

    block.castShadow = true;

    block.receiveShadow = true;

    world.add(block);

  }


  createPlatform(
    -25,10,-20,
    18,2,18
  );

  createPlatform(
    30,14,-5,
    20,2,15
  );

  createPlatform(
    0,20,35,
    15,2,15
  );


  const starGeo =
  new THREE.BufferGeometry();

  const count = 1200;

  const positions =
  new Float32Array(count*3);


  for(let i=0;i<count;i++){

    positions[i*3] =
    (Math.random()-.5)*500;

    positions[i*3+1] =
    30+Math.random()*230;

    positions[i*3+2] =
    (Math.random()-.5)*500;

  }


  starGeo.setAttribute(
    "position",
    new THREE.BufferAttribute(
      positions,
      3
    )
  );


  const stars =
  new THREE.Points(
    starGeo,
    new THREE.PointsMaterial({
      color:0xffffff,
      size:.7
    })
  );

  scene.add(stars);

}


function createPlatform(
  x,y,z,w,h,d
){

  const mesh =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      w,h,d
    ),
    new THREE.MeshStandardMaterial({
      color:0x37617e,
      roughness:.6
    })
  );

  mesh.position.set(
    x,y,z
  );

  mesh.castShadow = true;

  mesh.receiveShadow = true;

  world.add(mesh);

}


/* =========================================================
   PLAYER MESH
========================================================= */

function createCharacter(
  color,
  name
){

  const group =
  new THREE.Group();


  const body =
  new THREE.Mesh(
    new THREE.CapsuleGeometry(
      .38,
      .95,
      5,
      10
    ),
    new THREE.MeshStandardMaterial({
      color,
      roughness:.55
    })
  );

  body.position.y =
  .9;

  body.castShadow = true;

  group.add(body);


  const head =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      .34,
      16,
      12
    ),
    new THREE.MeshStandardMaterial({
      color:0xd7efff
    })
  );

  head.position.y =
  1.65;

  head.castShadow = true;

  group.add(head);


  const tag =
  createNameTag(name);

  tag.position.y =
  2.35;

  group.add(tag);


  return group;

}


function createLocalPlayer(){

  localMesh =
  createCharacter(
    0x269eff,
    me.name
  );

  scene.add(localMesh);

}


function createNameTag(name){

  const canvas =
  document.createElement("canvas");

  canvas.width = 512;

  canvas.height = 128;


  const ctx =
  canvas.getContext("2d");

  ctx.fillStyle =
  "rgba(4,10,20,.8)";

  ctx.beginPath();

  ctx.roundRect(
    35,20,442,88,22
  );

  ctx.fill();


  ctx.fillStyle =
  "#fff";

  ctx.font =
  "bold 46px Arial";

  ctx.textAlign =
  "center";

  ctx.textBaseline =
  "middle";

  ctx.fillText(
    name,
    256,
    64
  );


  const texture =
  new THREE.CanvasTexture(canvas);

  const sprite =
  new THREE.Sprite(
    new THREE.SpriteMaterial({
      map:texture,
      transparent:true,
      depthTest:false
    })
  );

  sprite.scale.set(
    3.2,.8,1
  );

  return sprite;

}


/* =========================================================
   REMOTE PLAYER
========================================================= */

function addRemote(data){

  if(data.id === myId)
    return;


  if(remotePlayers.has(data.id))
    return;


  const mesh =
  createCharacter(
    playerColor(data.id),
    data.name
  );


  mesh.position.set(
    data.x || 0,
    data.y || 0,
    data.z || 0
  );


  scene.add(mesh);


  remotePlayers.set(
    data.id,
    {
      mesh,

      target:
      new THREE.Vector3(
        data.x || 0,
        data.y || 0,
        data.z || 0
      ),

      yaw:data.yaw || 0,

      name:data.name,

      lastUpdate:performance.now()
    }
  );


  updatePlayerCount();

}


function updateRemote(data){

  let p =
  remotePlayers.get(data.id);


  if(!p){

    addRemote(data);

    p =
    remotePlayers.get(data.id);

  }


  if(!p)
    return;


  p.target.set(
    data.x,
    data.y,
    data.z
  );

  p.yaw =
  data.yaw || 0;

  p.lastUpdate =
  performance.now();

}


function removeRemote(id){

  const p =
  remotePlayers.get(id);

  if(!p)
    return;


  scene.remove(
    p.mesh
  );

  remotePlayers.delete(id);

  updatePlayerCount();

}


function updatePlayerCount(){

  playersText.textContent =
  "Players: " +
  (remotePlayers.size+1);

}


function playerColor(id){

  let n = 0;

  for(
    let i=0;
    i<id.length;
    i++
  ){

    n =
    ((n<<5)-n)+
    id.charCodeAt(i);

    n |= 0;

  }


  const colors = [
    0xff4d6d,
    0xffb84d,
    0x4dffb8,
    0x8c7bff,
    0xff66d9,
    0x55d6ff,
    0xd4ff4d
  ];


  return colors[
    Math.abs(n)%colors.length
  ];

}


/* =========================================================
   NETWORK PACKETS
========================================================= */

function packet(type,data={}){

  return {
    type,
    ...data
  };

}


function send(conn,data){

  if(
    conn &&
    conn.open
  ){

    try{
      conn.send(data);
    }catch(e){
      console.warn(e);
    }

  }

}


function broadcast(data,except=null){

  for(
    const [id,conn]
    of connections
  ){

    if(id === except)
      continue;

    send(
      conn,
      data
    );

  }

}


/* =========================================================
   CREATE ROOM
========================================================= */

createBtn.onclick =
createRoom;


function createRoom(){

  const name =
  cleanName(
    nameInput.value
  );


  if(!name){

    status.textContent =
    "Enter a player name first.";

    nameInput.focus();

    return;

  }


  me.name =
  name;

  isHost =
  true;


  status.textContent =
  "Connecting to public signaling...";


  createBtn.disabled =
  true;


  peer =
  new Peer({

/* =========================================================
   CONNECTION SETUP
========================================================= */

function setupConnection(conn){

  conn.on(
    "open",
    ()=>{

      connections.set(
        conn.peer,
        conn
      );


      send(
        conn,
        packet(
          "hello",
          {
            id:myId,
            name:me.name,
            x:me.pos.x,
            y:me.pos.y,
            z:me.pos.z,
            yaw:me.yaw
          }
        )
      );


      if(isHost){

        sendWorldState(
          conn
        );

        broadcast(
          packet(
            "playerJoined",
            {
              id:myId,
              name:me.name,
              x:me.pos.x,
              y:me.pos.y,
              z:me.pos.z,
              yaw:me.yaw
            }
          ),
          conn.peer
        );

      }


      startGame();

    }
  );


  conn.on(
    "data",
    data=>{

      handlePacket(
        conn,
        data
      );

    }
  );


  conn.on(
    "close",
    ()=>{

      connections.delete(
        conn.peer
      );

      removeRemote(
        conn.peer
      );


      if(isHost){

        broadcast(
          packet(
            "playerLeft",
            {
              id:conn.peer
            }
          )
        );

      }

    }
  );


  conn.on(
    "error",
    error=>{
      console.warn(
        "Connection error",
        error
      );
    }
  );

}


/* =========================================================
   WORLD STATE
========================================================= */

function sendWorldState(conn){

  const list = [];


  list.push({

    id:myId,

    name:me.name,

    x:me.pos.x,

    y:me.pos.y,

    z:me.pos.z,

    yaw:me.yaw

  });


  for(
    const [id,p]
    of remotePlayers
  ){

    list.push({

      id,

      name:p.name,

      x:p.mesh.position.x,

      y:p.mesh.position.y,

      z:p.mesh.position.z,

      yaw:p.mesh.rotation.y

    });

  }


  send(
    conn,
    packet(
      "worldState",
      {
        players:list
      }
    )
  );

}


/* =========================================================
   PACKET HANDLER
========================================================= */

function handlePacket(
  conn,
  data
){

  if(
    !data ||
    !data.type
  )
    return;


  switch(data.type){

    case "hello":

      addRemote(data);


      if(isHost){

        sendWorldState(
          conn
        );


        broadcast(
          packet(
            "playerJoined",
            data
          ),
          conn.peer
        );

      }

      break;


    case "worldState":

      for(
        const p
        of data.players || []
      ){

        if(
          p.id !== myId
        ){

          addRemote(p);

        }

      }

      break;


    case "playerJoined":

      if(
        data.id !== myId
      ){

        addRemote(data);

        systemMessage(
          data.name +
          " joined the game."
        );

      }


      if(isHost){

        broadcast(
          data,
          conn.peer
        );

      }

      break;


    case "playerState":

      if(
        data.id !== myId
      ){

        updateRemote(data);

      }


      if(isHost){

        broadcast(
          data,
          conn.peer
        );

      }

      break;


    case "playerLeft":

      removeRemote(
        data.id
      );


      if(isHost){

        broadcast(
          data,
          conn.peer
        );

      }

      break;


    case "chat":

      addChat(
        data.name,
        data.message
      );


      if(isHost){

        broadcast(
          data,
          conn.peer
        );

      }

      break;


    case "ping":

      send(
        conn,
        packet(
          "pong",
          {
            time:data.time
          }
        )
      );

      break;


    case "pong":

      lastPing =
      performance.now() -
      data.time;


      pingText.textContent =
      "P2P " +
      Math.round(lastPing) +
      " ms";

      break;

  }

}

/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function updateMovement(dt){

  if(!started)
    return;


  let forward =
  (keys.KeyW ? 1 : 0) -
  (keys.KeyS ? 1 : 0) -
  joyY;


  let side =
  (keys.KeyD ? 1 : 0) -
  (keys.KeyA ? 1 : 0) +
  joyX;


  const length =
  Math.hypot(
    forward,
    side
  );


  if(length > 1){

    forward /= length;
    side /= length;

  }


  const speed =
  me.running ||
  keys.ShiftLeft ||
  keys.ShiftRight
  ? RUN
  : WALK;


  const sin =
  Math.sin(me.yaw);

  const cos =
  Math.cos(me.yaw);


  const vx =
  (-sin*forward + cos*side) *
  speed;


  const vz =
  (-cos*forward - sin*side) *
  speed;


  me.vel.x =
  THREE.MathUtils.damp(
    me.vel.x,
    vx,
    12,
    dt
  );


  me.vel.z =
  THREE.MathUtils.damp(
    me.vel.z,
    vz,
    12,
    dt
  );


  me.vel.y -=
  GRAVITY*dt;


  me.pos.addScaledVector(
    me.vel,
    dt
  );


  if(
    me.pos.y <= 0
  ){

    me.pos.y = 0;

    me.vel.y = 0;

    me.grounded = true;

  }else{

    me.grounded = false;

  }


  const limit =
  WORLD/2-2;


  me.pos.x =
  THREE.MathUtils.clamp(
    me.pos.x,
    -limit,
    limit
  );


  me.pos.z =
  THREE.MathUtils.clamp(
    me.pos.z,
    -limit,
    limit
  );


  if(
    me.pos.y < -25
  ){

    me.pos.set(
      0,5,0
    );

    me.vel.set(
      0,0,0
    );

  }


  localMesh.position.copy(
    me.pos
  );


  localMesh.rotation.y =
  me.yaw;


  camera.position.set(
    me.pos.x,
    me.pos.y+1.55,
    me.pos.z
  );


  camera.rotation.order =
  "YXZ";

  camera.rotation.y =
  me.yaw;

  camera.rotation.x =
  me.pitch;

}

/* =========================================================
   NETWORK UPDATE
========================================================= */

function sendPlayerState(){

  const now =
  performance.now();


  if(
    now-lastSend <
    1000/NET_RATE
  )
    return;


  lastSend =
  now;


  const data =
  packet(
    "playerState",
    {
      id:myId,
      name:me.name,
      x:me.pos.x,
      y:me.pos.y,
      z:me.pos.z,
      yaw:me.yaw
    }
  );


  if(isHost){

    broadcast(data);

  }else{

    const host =
    connections.get(hostId);

    send(
      host,
      data
    );

  }

}


/* =========================================================
   REMOTE INTERPOLATION
========================================================= */

function updateRemotePlayers(){

  for(
    const p
    of remotePlayers.values()
  ){

    p.mesh.position.lerp(
      p.target,
      .18
    );


    let diff =
    p.yaw -
    p.mesh.rotation.y;


    diff =
    Math.atan2(
      Math.sin(diff),
      Math.cos(diff)
    );


    p.mesh.rotation.y +=
    diff*.18;


    p.mesh.children.forEach(
      child=>{
        if(child.isSprite){

          child.quaternion.copy(
            camera.quaternion
          );

        }
      }
    );

  }

}

/* =========================================================
   MOBILE JOYSTICK
========================================================= */

const joystick =
document.getElementById("joystick");

const stick =
document.getElementById("stick");


joystick.addEventListener(
  "pointerdown",
  e=>{

    joyActive =
    true;

    joystick.setPointerCapture(
      e.pointerId
    );

    moveJoystick(e);

  }
);


joystick.addEventListener(
  "pointermove",
  e=>{

    if(joyActive)
      moveJoystick(e);

  }
);


joystick.addEventListener(
  "pointerup",
  resetJoystick
);


joystick.addEventListener(
  "pointercancel",
  resetJoystick
);


function moveJoystick(e){

  const rect =
  joystick.getBoundingClientRect();


  const cx =
  rect.left+rect.width/2;

  const cy =
  rect.top+rect.height/2;


  let x =
  e.clientX-cx;

  let y =
  e.clientY-cy;


  const max =
  rect.width*.32;


  const len =
  Math.hypot(x,y);


  if(len > max){

    x =
    x/len*max;

    y =
    y/len*max;

  }


  joyX =
  x/max;

  joyY =
  y/max;


  stick.style.transform =
  `translate(
    calc(-50% + ${x}px),
    calc(-50% + ${y}px)
  )`;

}


function resetJoystick(){

  joyActive =
  false;

  joyX =
  0;

  joyY =
  0;

  stick.style.transform =
  "translate(-50%,-50%)";

}

   MOBILE CAMERA
========================================================= */

document.getElementById("lookArea");


lookArea.addEventListener(
  "pointerdown",
  e=>{

    lookActive =
    true;

    lookX =
    e.clientX;

    lookY =
    e.clientY;

    lookArea.setPointerCapture(
      e.pointerId
    );

  }
);

  "pointermove",

    if(!lookActive)

    const dx =

    e.clientY-lookY;


    lookX =
    e.clientX;

    lookY =
    e.clientY;


    me.yaw -=

    me.pitch -=
    dy*.007;


    me.pitch =
    THREE.MathUtils.clamp(
      me.pitch,
      -1.35,

    );

);


lookArea.addEventListener(

  }
  function reset(){window.joyX=0;window.joyY=0;if(kn)kn.style.transform='translate(-50%,-50%)';pid=null;}
  st?.addEventListener('pointerdown',e=>{e.preventDefault();pid=e.pointerId;st.setPointerCapture(pid);mv(e.clientX,e.clientY)});
  st?.addEventListener('pointermove',e=>{if(e.pointerId===pid){e.preventDefault();mv(e.clientX,e.clientY)}});
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>st?.addEventListener(t,reset));
  jb?.addEventListener('pointerdown',e=>{e.preventDefault();if(typeof jump==='function')jump();});
  cb?.addEventListener('click',async()=>{
    const url=location.href;
    try{await navigator.clipboard.writeText(url);cb.textContent='✓ Copied!';}
    catch(e){const t=document.createElement('textarea');t.value=url;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();cb.textContent='✓ Copied!';}
    setTimeout(()=>cb.textContent='🔗 Copy Link',1400);
  });
})();
</script>
